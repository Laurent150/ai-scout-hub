    <div class="mp-f"><span class="k">日期范围</span><div class="dates">
      <input type="date" data-k="from" aria-label="起始日期" min="${DATES[0]||''}" max="${DATES[DATES.length-1]||''}" value="${esc(S.from)}"><span class="muted">至</span>
      <input type="date" data-k="to" aria-label="结束日期" min="${DATES[0]||''}" max="${DATES[DATES.length-1]||''}" value="${esc(S.to)}"></div></div>
    <div class="mp-f wide"><span class="k">信源身份</span><div>${pills('role', ROLE_OPTS, true)}
      <div class="legend"><span>状态徽章下方的小标签表示信源身份：</span><span><span class="rtag rtag-off">官方</span> 官方账号</span><span><span class="rtag rtag-staff">官方人员</span> CEO、负责人、员工本人</span><span class="muted">第三方不标注</span></div></div></div>
  </div>
  <div class="chips" id="chips"></div>`;
}
function chipsHTML(){
  const c = [];
  const chip = (k, label, val) => c.push(`<span class="fchip"><span class="k">${esc(label)}</span>${esc(val)}<button type="button" data-clear="${k}" aria-label="移除筛选：${esc(label)} ${esc(val)}">×</button></span>`);
  if (S.q.trim()) chip('q', '搜索', S.q.trim());
  if (S.company) chip('company', '公司', S.company);
  if (S.product) chip('product', '产品', S.product);
  if (S.type) chip('type', '类型', S.type);
  if (S.gov) chip('gov', '政府机构', S.gov);
  if (S.status) chip('status', '状态', S.status);
  if (S.role) chip('role', '信源', S.role === 'official' ? '只看官方' : S.role);
  if (S.pf) chip('pf', '平台', PF_NAME[S.pf]);
  if (S.from || S.to) chip('date', '日期', S.from && S.to && S.from === S.to ? S.from : `${S.from||'最早'} 至 ${S.to||'最新'}`);
  return c.length ? c.join('') + '<button type="button" class="linkbtn" data-clearall="1">清空</button>' : '';
}

/* ================= 动态追踪：事件卡片 ================= */
const roleTag = r => r === '官方账号' ? '<span class="rtag rtag-off" title="信源：官方账号">官方</span>'
  : r === '官方人员' ? '<span class="rtag rtag-staff" title="信源：官方人员（CEO、负责人、员工本人）">官方人员</span>' : '';
function storyCard(st, rel, f){
  const primary = st.events[0];
  const parts = [];
  const hideEntity = f && rel === 'direct' && st.events.every(e => (
    (f[0]==='company' && companiesOf(e).length===1 && companiesOf(e)[0]===f[1]) || f[0]==='gov' ||
    (f[0]==='product' && PRODUCT_BY[f[1]] && e.entity === PRODUCT_BY[f[1]].company)));
  if (!hideEntity) parts.push(`<span class="co">${esc(primary.entity)}</span>`);
  const prod = st.events.map(e => e.product).find(Boolean);
  const topic = st.events.map(e => e.topic).find(Boolean);
  if (prod && !(f && f[0]==='product' && f[1]===prod)) parts.push(`<span class="prod">${esc(prod)}</span>`);
  else if (!prod && topic) parts.push(`<span class="topic">${esc(topic)}</span>`);
  const srcs = storySources(st);
  const types = uniq(st.events.map(e => e.type)).join(' · ');
  return `<article class="ev ev-merge role-${ROLE_CLS[primary.source_role]||'third'}" data-story="${esc(st.id)}">
    <div class="ev-row" role="button" tabindex="0" aria-expanded="false">
      <div class="ev-st">${stBadge(primary.status)}${roleTag(primary.source_role)}</div>
      <div class="ev-who">${parts.join('<span class="dot-sep">·</span>')}<span class="type">${esc(types)}</span><span class="relmark" title="${esc(st.why||'多条记录是同一件事')}">同一事件</span>${rel==='related'?'<span class="relmark" title="该事件的主体不是它，只是相关">相关</span>':''}</div>
      <p class="ev-sum">${st.events.map(e => esc(e.summary)).join('<br>')}</p>
      <div class="ev-src">${sourceRowHTML(srcs)}</div>
      <span class="chev" aria-hidden="true">▶</span>
    </div><div class="ev-body" hidden></div></article>`;
}
function storyDetailHTML(st){
  const out = [];
  if (st.why) out.push(`<p class="story-why">${esc(st.why)}</p>`);
  st.events.forEach(e => out.push(`<div class="drow"><span class="k">${esc(e.type)}</span><div>${esc(e.summary)}</div></div>`));
  const kd = [];
  st.events.forEach(e => Object.entries(e.key_data||{}).forEach(([k,v]) => kd.push([k,v])));
  if (kd.length) out.push(`<dl class="kv">${kd.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`);
  const people = uniq(st.events.map(e => e.person).filter(Boolean));
  if (people.length) out.push(`<div class="drow"><span class="k">发言人</span><div><b>${esc(people.join('、'))}</b></div></div>`);
  const srcs = storySources(st);
  out.push(`<div class="drow"><span class="k">来源 ${srcs.length}</span><div><ul class="srcs">${srcs.map(s => `<li>${pfBadge(s.platform)}<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a><span class="by">${esc([outletOf(s), s.role].filter(Boolean).join(' · '))}</span></li>`).join('')}</ul></div></div>`);
  const links = [], seen = new Set();
  const add = (html, key) => { if (seen.has(key)) return; seen.add(key); links.push(html); };

function bindTrack(){

  });

    if (t.closest('[data-clearall]')){ const d = S.desc; Object.assign(S, blank()); S.desc = d; return changed(true); }
    if (t.closest('#t-sort')){ S.desc = !S.desc; commit(false); return renderResults(); }
    if (t.closest('#t-more')){ UI.limit += 60; return renderResults(); }
    if (t.closest('#t-expand')){ const btn = t.closest('#t-expand'); const open = btn.textContent === '全部展开';

function capHash(){

  if (C.view === 'table') p.set('view', 'table');   // 打开产品卡片时也保留，返回时回到表格

const capLink = (cat, product) => { const p = new URLSearchParams(); if (cat) p.set('cat', cat); if (product) p.set('product', product); return '#capability?' + p.toString().replace(/\+/g,'%20'); };
function capCommit(push){
  const h = capHash();
  if (h !== location.hash){
    try { history[push?'pushState':'replaceState'](null, '', h); }
    catch(_) { lastHash = h; location.hash = h; return; }

function parseCap(query){

  const blocks = named.map(g => `<div class="cap-mg"><span class="cap-mg-k">${esc(g)}</span><div class="cap-seg" role="group" aria-label="${esc(g)}">${items.filter(it => SW_GROUP[it.id] === g).map(it => metricBtn(it, onId)).join('')}</div></div>`);
  const rest = items.filter(it => !named.includes(SW_GROUP[it.id]));
  if (rest.length) blocks.push(`<div class="cap-mg"><div class="cap-seg">${rest.map(it => metricBtn(it, onId)).join('')}</div></div>`);
  return `<div class="cap-metrics grouped" role="tablist" aria-label="指标">${blocks.join('')}</div>`;
}
function chartView(cat, shown, focus){
  const pool = focus ? capByCat(cat.id) : shown, o = {W: LAY.full, mob: LAY.mob, focus};
  const active = activeMetric(cat, shown);
  const cards = [];
  const drvCardHTML = wide => pool.some(p => p.driven_by) ? vcard({id: 'driven', wide, title: '驱动模型', body: `<dl class="drv-l">${pool.map(p => `<div><dt>${esc(p.product)}</dt><dd>${drvHTML(p)}</dd></div>`).join('')}</dl>`,
      src: srcLineOf(pool.map(p => p.driven_by).filter(d => d && d.source_name))}) : '';
  const drvCard = () => { const h = drvCardHTML(true); if (h) cards.push(h); };
  const featCards = () => {
    const withDrv = isFeatCat(cat) && pool.some(p => p.driven_by);
    const side = !!(withDrv && LAY && LAY.cols > 1);
    const covW = side ? Math.max(360, Math.floor((LAY.w - 16) * 0.6 - 44)) : LAY.full;
    const cov = chartCoverage(cat, pool, Object.assign({}, o, {W: covW, tall: side}));
    const mx = chartMatrix(cat, pool, Object.assign({}, o, {W: LAY.full}));
    const st = mx && mx.xs.some(f => f.value === false);
    const covCard = cov ? vcard({id: 'coverage', wide: !side, title: '功能覆盖', body: cov.svg, foot: cov.unknown ? '<span class="lgd"><i class="sw-u"></i>暂无公开数据</span>' : '', src: srcLineOf(pool.flatMap(p => cov.keys.map(k => featOf(p, k))).filter(f => f.source_name))}) : '';
    if (side && covCard) cards.push(`<div class="feat-pair">${covCard}${drvCardHTML(false)}</div>`);
    else {
      if (covCard) cards.push(covCard);
      if (withDrv) drvCard();
    }
    if (mx) cards.push(vcard({id: 'matrix', wide: true, title: '谁有什么', body: mx.svg, foot: `<span class="lgd"><i class="dt-y"></i>支持</span>${st ? '<span class="lgd"><i class="dt-n"></i>不支持</span>' : ''}${mx.xs.some(f => f.value == null) ? '<span class="lgd"><i class="dt-u"></i>暂无公开数据</span>' : ''}<span>${mx.over ? '左右滑动查看全部 · ' : ''}点圆点看说明和来源</span>`, src: srcLineOf(mx.xs.filter(f => f.source_name))}));
  };
  const oneMetric = () => {
    const m = metricsOf(cat).find(x => x.id === active);
    if (!m || (focus && !focus.metrics[m.id])) return;
    const k = kindOf(m, pool);
    if (k === 'none') return;
    if (k === 'nerf'){
      const bars = chartNerfBars(m, pool, o);
      const lines = chartNerfLines(m, pool, o);
      if (bars) cards.push(vcard({id: m.id, wide: true, title: mTitle(cat, m), body: bars.svg, foot: focus ? '' : missLine(bars.miss), src: nerfCaption(bars.xs)}));
      if (lines) cards.push(vcard({id: m.id + '-line', wide: true, title: '<span class="mn">随时间</span>', body: lines.svg, foot: lines.legend, src: nerfCaption(lines.xs)}));
      return;
    }
    if (k === 'batches'){
      const bars = chartBatches(m, pool, o);
      if (!bars) return;
      cards.push(vcard({id: m.id, wide: true, title: mTitle(cat, m), body: bars.svg, foot: [bars.legend, focus ? '' : missLine(bars.miss)].filter(Boolean).join(''), src: batchCaption(bars.xs)}));
      return;
    }
    if (k === 'other'){
      const ps = pool, rows = `<tr><th>${mTitle(cat, m)}</th>${ps.map(p => `<td class="${focus && p !== focus ? 'ref' : ''}">${cellVals(p, m, {bar: false})}</td>`).join('')}</tr>`;
      cards.push(vcard({id: m.id, wide: true, title: mTitle(cat, m), body: `<div class="mini-scroll"><table class="mini-t"><thead><tr><th></th>${ps.map(p => `<th>${esc(p.product)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`, src: srcLineOf(ps.map(p => p.metrics[m.id]))}));
      return;
    }
    const r = k === 'dots' ? chartDots(m, pool, o) : chartBars(m, pool, o);
    if (!r) return;
    cards.push(vcard({id: m.id, wide: true, title: mTitle(cat, m), body: r.svg, foot: [r.hatched ? LEGEND_SRC : '', k === 'dots' ? `<span>坐标轴从 ${r.lo} 起</span>` : '', focus ? '' : missLine(r.miss)].filter(Boolean).join(''), src: srcLineOf(r.xs)}));
    const sp = scatterSpec(cat);
    if (sp && m.id === sp.ym.id){
      const sc = chartScatter(cat, pool, o);
      if (sc) cards.push(vcard({id: 'scatter', wide: true, title: '价格 × 智能', body: sc.svg, foot: sc.open ? '<span class="lgd"><i class="dt-n"></i>开源模型</span>' : '', src: srcLineOf(sc.xs)}));
    }
  };
  if (active === '__feat') featCards();
  else if (active === '__drv') drvCard();
  else oneMetric();
  if (!cards.length) return `<div class="card empty">所选产品在这个类别里还没有可画图的数据。</div>`;
  const cos = uniq(pool.map(p => p.company));
  const legend = `<div class="co-lg">${cos.map(c => `<span><i class="sw" style="background:${coColor(c)}"></i>${esc(c)}</span>`).join('')}${focus ? `<span class="muted">· 灰色为同类其它产品</span>` : ''}</div>`;
  const plansHint = pool.some(p => (p.plans || []).length) ? `<p class="cap-more"><button type="button" class="linkbtn" data-view="table">套餐与价格见表格视图 →</button></p>` : '';
  return legend + `<div class="vgrid">${cards.join('')}</div>` + plansHint;
}

/* ---------- 表格视图 ---------- */
function bestOf(m, prods){
  const hib = hibOf(m); if (typeof hib !== 'boolean') return null;
  const xs = prods.map(p => { const d = dualOf(p.metrics[m.id]); return d ? (d.third || d.off || p.metrics[m.id]) : null; }).filter(Boolean);
  if (xs.length < 2 || xs.some(x => typeof x.num !== 'number')) return null;
  const ns = xs.map(x => x.num); return hib ? Math.max(...ns) : Math.min(...ns);
}
function capTable(cat, prods){
  const head = `<thead><tr><th class="mcol corner" scope="col">指标</th>${prods.map(p => `<th class="pcol" scope="col"><button type="button" class="pname" data-open="${esc(p.product)}" title="查看 ${esc(p.product)} 的全部指标"><i class="sw" style="background:${colOf(p)}"></i>${esc(p.product)}</button><div class="pco">${esc(p.company||'—')}</div></th>`).join('')}</tr></thead>`;
  const grp = name => `<tr class="grp"><th class="mcol" scope="rowgroup">${esc(name)}</th><td colspan="${prods.length}"></td></tr>`;
  const row = (th, cells, cls) => `<tr${cls ? ` class="${cls}"` : ''}><th class="mcol" scope="row">${th}</th>${cells}</tr>`;
  let body = '';
  if (prods.some(p => p.driven_by)) body += row('<span class="mn">驱动模型</span>', prods.map(p => `<td class="v drv">${drvHTML(p)}</td>`).join(''), 'tr-drv');
  const keys = featKeys(cat, prods);
  const feats = () => { if (!keys.length) return;
    body += grp(isFeatCat(cat) ? '功能' : '功能清单');
    keys.forEach(k => { body += row(fTitle(cat, k), prods.map(p => `<td class="v fcell">${featBtn(p, k)}</td>`).join('')); });
    if (prods.some(p => (p.platforms || []).length)) body += row('<span class="mn">平台</span>', prods.map(p => `<td class="v">${platHTML(p)}</td>`).join(''));
  };
  if (isFeatCat(cat)) feats();
  cat.metric_groups.forEach(g => {
    const ms = g.metrics.filter(m => prods.some(p => p.metrics[m.id]));   // 全部为空的指标在对比表里省略（产品卡片里仍显示）
    if (!ms.length) return;
    body += grp(g.name);
    ms.forEach(m => { const best = bestOf(m, prods);
      body += row(mTitle(cat, m), prods.map(p => { const d = dualOf(p.metrics[m.id]); const a = d && (d.third || d.off || p.metrics[m.id]);
        const isBest = best !== null && a && a.num === best, txt = a && (typeof a.value === 'string' || (a.display || '').length > 16);
        return `<td class="v${isBest ? ' best' : ''}${txt ? ' txt' : ''}">${cellVals(p, m)}</td>`; }).join('')); });
  });
  if (!isFeatCat(cat)) feats();
  if (prods.some(p => (p.plans||[]).length)){
    if (!cat.metric_groups.some(g => g.name === '性价比' && g.metrics.some(m => prods.some(p => p.metrics[m.id])))) body += grp('性价比');
    body += row('<span class="mn">套餐与价格</span>', prods.map(p => `<td class="v plans">${(p.plans||[]).length ? `<ul>${p.plans.map(planLI).join('')}</ul>` : NA}</td>`).join(''), 'tr-plans');
  }
  return `<div class="cap-meta"><span><b>${prods.length}</b> 个产品 · 点击产品名查看详情 · 点击数值查看来源</span><span class="cap-hint" id="cap-hint" hidden>左右滑动查看更多 →</span></div>
    <div class="cap-scroll" id="cap-scroll"><table class="cap-t${prods.length > 4 ? ' stack' : ''}">${head}<tbody>${body}</tbody></table></div>`;
}
/** 数据来源脚注（默认收起）：按来源名归并；同名多个链接时，每个链接用对应产品名标注 */
function capSources(cat, prods){
  const by = new Map(), nameOf = {};
  const add = (name, url, prod) => { if (!url) return; if (!by.has(name)) by.set(name, new Map()); const m = by.get(name); if (!m.has(url)) m.set(url, new Set()); m.get(url).add(prod); };
  const metrics = metricsOf(cat);
  const each = (p, fn) => { metrics.forEach(m => { const x = p.metrics[m.id]; if (x) [x, ...(x.alt||[])].forEach(fn); }); Object.values(p.fdetail || {}).forEach(fn); if (p.driven_by) fn(p.driven_by); };
  prods.forEach(p => each(p, y => { if (y.url && y.source_name) nameOf[y.url] = y.source_name; }));
  prods.forEach(p => {
    each(p, y => add(y.source_name || nameOf[y.url] || hostOf(y.url), y.url, p.product));
    Object.values(p.feature_sources||{}).forEach(u => add(nameOf[u] || hostOf(u), u, p.product));
    (p.plans||[]).forEach(pl => add(nameOf[pl.url] || hostOf(pl.url), pl.url, p.product));
  });
  if (!by.size) return '';
  const items = [...by.entries()].sort((a, b) => a[0].localeCompare(b[0], 'zh')).map(([name, urls]) => urls.size === 1 ? `<li>${ext([...urls.keys()][0], esc(name))}</li>`
    : `<li><span class="sn">${esc(name)}</span>：${[...urls.entries()].map(([u, ps]) => ext(u, esc([...ps].join(' / ')))).join('<span class="sep">、</span>')}</li>`).join('');
  return `<details class="cap-srcs"><summary>数据来源（${by.size}）</summary><ul>${items}</ul></details>`;
}

/* ---------- 产品卡片 ---------- */
/** 参照条：本产品的值画成彩色条，同类其它产品画成浅灰刻度，右边写名次 */
function refStrip(m, p){
  const x = p.metrics[m.id];
  const all = capByCat(p.category).filter(q => q.metrics[m.id] && typeof q.metrics[m.id].num === 'number');
  if (!x || typeof x.num !== 'number' || all.length < 2 || typeof hibOf(m) !== 'boolean') return '';
  const pct = unitOf(m) === '%', elo = /elo/i.test(m.id), vs = all.map(q => q.metrics[m.id].num);
  let lo = 0, hi = pct ? 100 : niceMax(Math.max(...vs));
  if (elo){ lo = Math.floor((Math.min(...vs) - 10) / 10) * 10; hi = Math.ceil((Math.max(...vs) + 10) / 10) * 10; }
  if (pct && (Math.max(...vs) > 100 || Math.min(...vs) < 0)){ const d = nerfDomain(vs); lo = d.lo; hi = d.hi; }
  const W = 240, X = v => 3 + (W - 6) * Math.max(0, v - lo) / (hi - lo), c = colOf(p);
  const sorted = vs.slice().sort((a, b) => hibOf(m) ? b - a : a - b), rank = sorted.indexOf(x.num) + 1;
  const others = all.filter(q => q !== p).map(q => `<line x1="${X(q.metrics[m.id].num)}" x2="${X(q.metrics[m.id].num)}" y1="2" y2="16" stroke="var(--ref-ink)" stroke-width="2"><title>${esc(q.product)}：${esc(q.metrics[m.id].display)}</title></line>`).join('');
  return `<span class="ref" title="灰色刻度：同类其它 ${all.length - 1} 个产品"><svg width="${W}" height="18" viewBox="0 0 ${W} 18"><rect x="3" y="7" width="${W - 6}" height="4" rx="2" fill="var(--line2)"/><rect x="3" y="5" width="${Math.max(3, X(x.num) - 3)}" height="8" rx="3" fill="${c}"/>${others}</svg><span class="rk">第 ${rank} / ${all.length}</span></span>`;
}
const srcLine = y => [y.source_name ? ext(y.url, esc(y.source_name) + (y.url ? ' ↗' : '')) : (y.url ? ext(y.url, '来源 ↗') : ''), esc(y.date || '')].filter(Boolean).join(' · ');
function capCard(p){
  const cat = CAP_CATS.find(c => c.id === p.category) || {id: p.category, name: p.category, metric_groups: []};
  const t = trackOf(p.product);
  const metricRow = m => {
    const x = p.metrics[m.id];
    const dt = `<dt>${mTitle(cat, m)}</dt>`;
    if (!x) return `<div class="r">${dt}<dd>${NA}<span class="src-line">暂无公开数据</span></dd></div>`;
    const d = dualOf(x), lines = [d.third, d.off, ...d.extra].filter(Boolean);
    const spark = m.chart === 'nerf' && x.series && x.series.filter(pt => typeof pt.num === 'number').length >= 2
      ? chartNerfLines(m, capByCat(p.category), {W: LAY.full, mob: LAY.mob, focus: p, solo: true}) : null;
    return `<div class="r">${dt}<dd><div class="vals">${cellVals(p, m, {bar: false})}${refStrip(m, p)}</div>
      ${spark ? `<div class="nerf-spark">${spark.svg}</div>` : ''}
      ${lines.map(y => `<div class="sl">${srcTag(y)}${lines.length > 1 ? `<span class="sv">${esc(y.display)}</span>` : ''}<span class="src-line">${srcLine(y)}</span>${y.note ? `<span class="note">${esc(y.note)}</span>` : ''}</div>`).join('')}</dd></div>`;
  };
  const secs = [];
  const keys = featKeys(cat, [p]);
  const featSec = () => keys.length ? `<section class="cc-g"><h3>${isFeatCat(cat) ? '功能' : '功能清单'}</h3><dl class="cc-dl">${keys.map(k => { const f = featOf(p, k);
    return `<div class="r"><dt>${fTitle(cat, k)}</dt><dd><div class="vals">${featBtn(p, k)}${f.note ? `<span class="fnote">${esc(f.note)}</span>` : ''}</div>${f.url || f.source_name ? `<div class="sl"><span class="src-line">${srcLine(f.url && !f.source_name ? Object.assign({}, f, {source_name: hostOf(f.url)}) : f)}</span></div>` : ''}</dd></div>`; }).join('')}</dl></section>` : '';
  if (isFeatCat(cat)) secs.push(featSec());
  cat.metric_groups.forEach(g => { if (g.metrics.length) secs.push(`<section class="cc-g"><h3>${esc(g.name)}</h3><dl class="cc-dl">${g.metrics.map(metricRow).join('')}</dl></section>`); });
  if (!isFeatCat(cat)) secs.push(featSec());
  if ((p.plans||[]).length) secs.push(`<section class="cc-g"><h3>套餐与价格</h3><ul class="plans">${p.plans.map(planLI).join('')}</ul></section>`);
  const sp = scatterSpec(cat) && p.metrics[scatterSpec(cat).ym.id] && p.metrics[scatterSpec(cat).xm.id] ? chartScatter(cat, capByCat(cat.id), {W: Math.min(560, LAY.full - (LAY.mob ? 4 : 56)), mob: LAY.mob, focus: p}) : null;
  const facts = [p.company ? esc(p.company) : '', p.release_date ? `发布 ${esc(p.release_date)}` : '', p.official_url ? `<a href="${esc(safeUrl(p.official_url))}" target="_blank" rel="noopener">官网 ↗</a>` : ''].filter(Boolean).join('<span class="dot-sep">·</span>');
  const kv = [p.driven_by ? `<div><dt>驱动模型</dt><dd>${drvHTML(p)}</dd></div>` : '', (p.platforms||[]).length ? `<div><dt>平台</dt><dd>${platHTML(p, {notes: true})}</dd></div>` : ''].join('');
  return `<article class="card cap-card"><a href="${capLink(p.category,'')}" class="back" data-back="1">← 返回${esc(cat.name)}</a>
    <div class="pin-k"><i class="sw" style="background:${colOf(p)}"></i>${esc(cat.name)}</div><h2>${esc(p.product)}</h2>
    ${facts ? `<div class="pin-sub">${facts}</div>` : ''}
    ${p.summary ? `<p class="cc-sum">${esc(p.summary)}</p>` : ''}
    ${(p.features||[]).length ? `<div class="cc-feat">${p.features.map(f => `<span class="pchip">${esc(f)}</span>`).join('')}</div>` : ''}
    ${kv ? `<dl class="cc-kv">${kv}</dl>` : ''}
    ${t ? `<a class="cc-link" href="${trackLink({product: t})}">查看动态 →</a>` : ''}
    ${sp ? `<section class="cc-g cc-sc"><h3>价格 × 智能 <span class="muted">（灰色为同类其它产品）</span></h3>${sp.svg}</section>` : ''}
    ${secs.join('') || '<p class="muted">暂无指标数据。</p>'}</article>`;
}

/* ---------- 渲染 ---------- */
function renderCap(){
  const v = $('#view-cap');
  capPop(null);
  if (!CAP || !CAP_PRODS.length){
    v.innerHTML = `<div class="cap"><div class="card empty"><b style="color:var(--ink)">产品能力数据还在整理中</b><br>生成 <code>data/capabilities.json</code> 后重新运行 <code>python3 build.py</code>，这里会显示各类产品的能力对比。</div></div>`;
    return;
  }

  const note = `<p class="cap-note">点击数值、条形或圆点查看来源${upd ? `<span class="upd">数据更新于 ${esc(upd)}</span>` : ''}</p>`;

  if (prod) body = capCard(prod) + capSources(cat, [prod]);
  else if (!all.length) body = `<div class="card empty">这个类别还没有产品数据。</div>`;
  else {
    const one = C.cols && sel.length === 1 ? sel[0] : null;
    const cols = all.length > 1 ? `<div class="cap-cols"><span class="k">对比</span>${all.map(p => `<button type="button" class="cchip${shown.includes(p)?' on':''}" data-col="${esc(p.product)}" aria-pressed="${shown.includes(p)}">${esc(p.product)}</button>`).join('')}${C.cols?'<button type="button" class="linkbtn" data-colall="1">全部</button>':''}</div>` : '';

/* ---------- 来源浮层：条形、圆点、散点、表格数值、功能格、驱动模型都用它 ---------- */
let popT = null, popFor = null, popPinned = false;
function srcBlock(y, unit, k){
  return `<div class="pp-s${k ? ' pp-alt' : ''}">${k ? `<div class="pp-k">${k}</div>` : ''}<div class="pp-v">${srcTag(y)}<span>${esc(y.display)}${unit && /^[\d.,\s]+$/.test(y.display) ? ` <span class="muted pp-u">${esc(unit)}</span>` : ''}</span></div>
    <dl>${y.source_name || y.url ? `<div><dt>来源</dt><dd>${y.source_name ? ext(y.url, esc(y.source_name)) : ext(y.url, esc(hostOf(y.url)))}</dd></div>` : ''}${y.date ? `<div><dt>日期</dt><dd>${esc(y.date)}</dd></div>` : ''}${y.note ? `<div><dt>备注</dt><dd>${esc(y.note)}</dd></div>` : ''}</dl>
    ${y.url ? `<a class="pp-link" href="${esc(safeUrl(y.url))}" target="_blank" rel="noopener">查看来源 ↗</a>` : ''}</div>`;
}
function capPop(btn){
  let pop = $('#cap-pop');
  if (!btn){ if (pop) pop.hidden = true; popFor = null; popPinned = false; return; }
  if (!pop){ pop = document.createElement('div'); pop.id = 'cap-pop'; pop.className = 'card cap-pop'; pop.setAttribute('role','tooltip'); document.body.appendChild(pop);
    pop.addEventListener('mouseenter', () => clearTimeout(popT)); pop.addEventListener('mouseleave', () => { if (!popPinned) popT = setTimeout(() => !popPinned && capPop(null), 200); }); }
  let html = '';
  const ds = btn.dataset;
  if (ds.src){
    const [i, mids] = ds.src.split('|'); const p = CAP_PRODS[+i]; if (!p) return;
    html = mids.split(',').map((mid, j) => {
      const x = p.metrics[mid], m = metricBy(p.category, mid) || {id: mid, name: mid}; if (!x) return '';
      const d = dualOf(x), main = d.third || d.off || x, rest = [x, ...(x.alt||[])].filter(y => y !== main);
      return `${j ? '<div class="pp-sep"></div>' : ''}<div class="pp-h">${esc(p.product)} · ${esc(m.name)}</div>${srcBlock(main, unitOf(m), '')}` +
        rest.map((y, k) => srcBlock(y, unitOf(m), `另一来源${rest.length > 1 ? ' ' + (k + 1) : ''}${y.display !== main.display ? '<span class="neq-k">数值不同</span>' : ''}`)).join('');
    }).join('');
  } else if (ds.feat){
    const [i, k] = ds.feat.split('|'); const p = CAP_PRODS[+i]; if (!p) return; const f = featOf(p, k);
    html = `<div class="pp-h">${esc(p.product)} · ${esc(k)}</div><div class="pp-v">${flagMark(f.value)}<span>${f.value === true ? '支持' : f.value === false ? '不支持' : '暂无公开数据'}</span></div>
      <dl>${f.note ? `<div><dt>说明</dt><dd>${esc(f.note)}</dd></div>` : ''}${f.source_name || f.url ? `<div><dt>来源</dt><dd>${f.source_type ? srcTag(f) + ' ' : ''}${ext(f.url, esc(f.source_name || hostOf(f.url)))}</dd></div>` : ''}${f.date ? `<div><dt>日期</dt><dd>${esc(f.date)}</dd></div>` : ''}</dl>
      ${f.url ? `<a class="pp-link" href="${esc(safeUrl(f.url))}" target="_blank" rel="noopener">查看来源 ↗</a>` : ''}`;
  } else if (ds.drv){
    const p = CAP_PRODS[+ds.drv]; const d = p && p.driven_by; if (!d) return;
    html = `<div class="pp-h">${esc(p.product)} · 驱动模型</div>` + (d.status === '已公开' && d.models.length
      ? `<ul class="pp-models">${d.models.map(m => `<li><b>${m.linked_product ? `<a href="${capLink(m.linked_cat, m.linked_product)}">${esc(m.model)}</a>` : esc(m.model)}</b>${m.note ? `<span>${esc(m.note)}</span>` : ''}</li>`).join('')}</ul>`
      : `<div class="pp-v"><span class="muted">未公开</span></div>`) +
      `<dl>${d.note ? `<div><dt>说明</dt><dd>${esc(d.note)}</dd></div>` : ''}${d.source_name || d.url ? `<div><dt>来源</dt><dd>${srcTag(d)} ${ext(d.url, esc(d.source_name || hostOf(d.url)))}</dd></div>` : ''}${d.date ? `<div><dt>日期</dt><dd>${esc(d.date)}</dd></div>` : ''}</dl>
      ${d.url ? `<a class="pp-link" href="${esc(safeUrl(d.url))}" target="_blank" rel="noopener">查看来源 ↗</a>` : ''}`;
  } else if (ds.info){
    const [cid, mid] = ds.info.split('|'); const fc = CAP_CATS.find(c => c.id === cid), fd = fc && (fc.feature_desc || {})[mid];
    const m = metricBy(cid, mid) || (fd ? {id: mid, name: mid, desc: fd} : null); if (!m) return;
    html = `<div class="pp-h">${esc(m.name)}${unitOf(m) ? ` <span class="muted">（${esc(unitOf(m))}）</span>` : ''}</div><p>${esc(m.desc || '暂无说明')}</p>${hibOf(m) === true ? '<p class="muted">↑ 越高越好</p>' : hibOf(m) === false ? '<p class="muted">↓ 越低越好</p>' : ''}`;
  }
  if (!html) return;
  pop.innerHTML = html; pop.hidden = false; popFor = btn;
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  const left = Math.min(Math.max(8, r.left + r.width/2 - w/2), innerWidth - w - 8);
  let top = r.bottom + 8; if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 8);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
const POP_SEL = '[data-src],[data-info],[data-feat],[data-drv]';
function bindCap(){
  const v = $('#view-cap');
  const hover = matchMedia('(hover: hover)').matches;
  v.addEventListener('click', e => {
    const t = e.target;
    const b = t.closest(POP_SEL);
    // 点击：悬停已打开的浮层改为「固定」（可以移动鼠标去点链接）；再点一次关闭
    if (b){ e.stopPropagation(); if (popFor === b && popPinned) return capPop(null); if (popFor !== b) capPop(b); popPinned = true; return; }
    const c = t.closest('[data-cat]'); if (c){ C.cat = c.dataset.cat; C.product = ''; C.cols = null; C.metric = ''; capCommit(true); return renderCap(); }
    const mt = t.closest('[data-metric]'); if (mt){ C.metric = mt.dataset.metric; capCommit(false); return renderCap(); }
    const vw = t.closest('[data-view]'); if (vw){ C.view = vw.dataset.view; capCommit(false); renderCap(); return; }
    const o = t.closest('[data-open]'); if (o){ C.product = o.dataset.open; capCommit(true); renderCap(); return window.scrollTo(0, 0); }
    if (t.closest('[data-back]')){ e.preventDefault(); C.product = ''; capCommit(true); return renderCap(); }
    const col = t.closest('[data-col]');
    if (col){ const all = capByCat(C.cat).map(p => p.product); let cur = C.cols ? C.cols.slice() : all.slice(); const n = col.dataset.col;
      // 全选状态下点一个 = 只看这一个；之后再点其它 = 加入 / 移出
      if (!C.cols) cur = [n]; else cur = cur.includes(n) ? cur.filter(x => x !== n) : all.filter(x => cur.includes(x) || x === n);
      C.cols = !cur.length || cur.length === all.length ? null : cur; capCommit(false); return renderCap(); }
    if (t.closest('[data-colall]')){ C.cols = null; capCommit(false); return renderCap(); }
  });
  if (hover){
    v.addEventListener('mouseover', e => { const b = e.target.closest(POP_SEL); if (b && b !== popFor && !popPinned){ clearTimeout(popT); capPop(b); } else if (b) clearTimeout(popT); });
    v.addEventListener('mouseout', e => { const b = e.target.closest(POP_SEL); if (b && !popPinned && !(e.relatedTarget && b.contains(e.relatedTarget))){ popT = setTimeout(() => !popPinned && capPop(null), 250); } });
  }
  document.addEventListener('click', e => { if (popFor && !e.target.closest('#cap-pop')) capPop(null); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') capPop(null); });
  window.addEventListener('scroll', () => { if (popFor) capPop(null); }, {passive:true});
  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
    if (!$('#view-cap').classList.contains('on') || !LAY) return;
    const n = capLayout(); if (Math.abs(n.w - LAY.w) > 24 || n.cols !== LAY.cols) renderCap();
    const sc = $('#cap-scroll'), h = $('#cap-hint'); if (sc && h) h.hidden = sc.scrollWidth <= sc.clientWidth + 2; }, 150); });
}


/* ================= 路由 ================= */
function route(){
  if (location.hash === lastHash) return;
  lastHash = location.hash;
  const raw = location.hash.replace(/^#/,'');
  const qi = raw.indexOf('?');
  let path = qi < 0 ? raw : raw.slice(0, qi);
  try { path = decodeURIComponent(path); } catch(_) {}
  const query = qi < 0 ? '' : raw.slice(qi+1);
  const [tab, ...rest] = path.split('/');
  const t = ['track','events','timeline'].includes(tab) ? 'track' : tab === 'capability' ? 'cap' : 'daily';
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'view-'+t));
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === t));
  document.body.classList.toggle('wide', t === 'cap');
  if (t === 'daily') return renderDaily(tab === 'daily' ? (rest[0] || '') : '');
  if (t === 'cap'){ parseCap(query); renderCap(); return; }
  const prevFocus = JSON.stringify(focusOf());
  parseTrack(tab, rest, query);
  if (tab !== 'track') commit(false);              // 旧链接改写成新格式
  renderTrack();
  if (JSON.stringify(focusOf()) !== prevFocus && window.scrollY > 200) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
window.addEventListener('popstate', route);
bindTrack();
bindCap();
renderStatus(); setInterval(renderStatus, 60000);

  (D.warnings.length ? `<div class="w">⚠ ${D.warnings.map(esc).join('<br>⚠ ')}</div>` : '');
route();
})();
