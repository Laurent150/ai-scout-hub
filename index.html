<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Scout Hub · AI 行业情报</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
<style>/* AI Scout Hub v3 —— 少颜色（状态色 + 一个强调色）、留白充足、限制行长 */
:root{
  --bg:#f7f8fa;--card:#fff;--ink:#1f2430;--ink2:#3b4252;--muted:#7a8193;--faint:#a3a9b6;--line:#e8eaef;--line2:#f0f1f4;
  --accent:#4f46e5;--accent-soft:#eef0ff;--accent-mid:#a5a1f3;
  --green:#15803d;--green-bg:#e9f6ee;--blue:#1d4ed8;--blue-bg:#eaf0fd;--amber:#b45309;--amber-bg:#fcf3e3;--gray:#6b7280;--gray-bg:#eef0f3;--red:#c2410c;--red-bg:#fdeee6;
  --r:12px;--shadow:0 1px 2px rgba(16,24,40,.04);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1220;--card:#171b2c;--ink:#e6e8f0;--ink2:#c9cdd8;--muted:#98a0b3;--faint:#6f7790;--line:#262b40;--line2:#1f2436;
  --accent:#8b85ff;--accent-soft:#232650;--accent-mid:#5b56b8;
  --green:#4ade80;--green-bg:#12301f;--blue:#7aa7ff;--blue-bg:#16264a;--amber:#fbbf24;--amber-bg:#3a2c0c;--gray:#a3a9b7;--gray-bg:#252a3a;--red:#fb923c;--red-bg:#3b2010;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--font)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.muted{color:var(--muted)}.small{font-size:12.5px}
[hidden]{display:none!important}
input,select,button{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
input:focus,select:focus,button:focus-visible,.ev-row:focus-visible{outline:2px solid var(--accent-mid);outline-offset:1px}
button{cursor:pointer}
select{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.linkbtn{border:none;background:none;padding:0;min-height:0;color:var(--accent);font-size:inherit;cursor:pointer}
.linkbtn:hover{text-decoration:underline}

/* ---------- header ---------- */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-inner{display:flex;align-items:center;gap:28px;height:54px}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink)}.brand:hover{text-decoration:none}
.logo{width:24px;height:24px;border-radius:7px;background:radial-gradient(circle at 50% 50%,#fff 0 22%,transparent 23%),var(--accent);flex:none}
.name{font-weight:700;font-size:16px;letter-spacing:.2px}
.tabs{display:flex;gap:4px;height:100%}
.tabs a{display:flex;align-items:center;padding:0 12px;color:var(--muted);font-weight:600;font-size:15px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{text-decoration:none;color:var(--ink)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.status-strip{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
.src{display:inline-flex;align-items:center;gap:5px}
.src .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.src.warn{color:var(--amber)}.src.warn .dot{background:var(--amber)}
.src.bad{color:var(--red)}.src.bad .dot{background:var(--red)}
.src b{font-weight:600;color:var(--ink2)}.src.warn b,.src.bad b{color:inherit}
main.wrap{padding-top:28px;padding-bottom:48px;min-height:60vh}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}

/* ---------- 共用小部件 ---------- */
.badge{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;line-height:20px;font-weight:600;white-space:nowrap}
.st-已发布{background:var(--green-bg);color:var(--green)}.st-测试中{background:var(--blue-bg);color:var(--blue)}
.st-传闻{background:var(--amber-bg);color:var(--amber)}.st-已辟谣{background:var(--gray-bg);color:var(--gray);text-decoration:line-through}
.type{display:inline-block;font-size:12px;line-height:18px;padding:0 6px;border:1px solid var(--line);border-radius:5px;color:var(--muted);white-space:nowrap}
.pf{display:inline-block;font-size:10.5px;line-height:16px;padding:0 5px;border-radius:4px;font-weight:700;vertical-align:1px;margin:0 4px 0 1px}
.pf-x{background:#1f2430;color:#fff}.pf-youtube{background:#e11d48;color:#fff}.pf-web{background:var(--gray-bg);color:var(--gray)}
@media (prefers-color-scheme:dark){.pf-x{background:#e6e8f0;color:#111}}
.mk{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:999px;font-weight:600;white-space:nowrap;vertical-align:1px}
.mk-watch{background:var(--red-bg);color:var(--red)}.mk-rumor{background:var(--amber-bg);color:var(--amber)}
.pk{display:inline-block;font-size:11.5px;line-height:18px;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* ---------- daily ---------- */
/* 左侧窄目录：整列一条细竖线贯穿全高，目录本身吸顶；当前小节用强调色 */
.daily-layout{display:grid;grid-template-columns:150px minmax(0,1fr);gap:28px;align-items:stretch}
.daily-layout.no-toc{grid-template-columns:minmax(0,1fr)}.daily-layout.no-toc .dtoc{display:none}
.dtoc{position:relative}
/* 目录占满一屏高度（视口 − 吸顶头部 − 上下留白），各项上下均匀分布；min-height 保证内容再多也不会重叠 */
.dtoc nav{position:sticky;top:80px;min-height:calc(100vh - 80px - 28px);display:flex;flex-direction:column;justify-content:space-between;padding:10px 0 14px}
.dtoc a{position:relative;display:block;padding:4px 6px 4px 24px;color:var(--muted);font-size:13.5px;line-height:1.45;transition:color .25s}
.dtoc a:hover{color:var(--ink);text-decoration:none}
.dtoc a.on{color:var(--accent);font-weight:600}
.dtoc a.done{color:var(--ink2)}
/* 节点：已读 / 当前实心，未读空心；与动态追踪时间线同一视觉语言 */
.dtoc .nd{position:absolute;left:3px;top:calc(4px + .725em - 5px);width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--accent-mid);box-sizing:border-box;z-index:1;transition:background .25s,border-color .25s,box-shadow .25s}
.dtoc a.done .nd{background:var(--accent);border-color:var(--accent)}
.dtoc a.on .nd{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.dtoc a:hover .nd{border-color:var(--accent)}
.trk{position:absolute;left:7px;width:2px;border-radius:2px;background:color-mix(in srgb,var(--accent) 18%,var(--bg))}
.trk-fill{position:absolute;left:0;top:0;width:100%;height:0;border-radius:2px;background:var(--accent);transition:height .3s ease-out}
@media (min-width:768px) and (max-height:520px){ .dtoc nav{min-height:0;justify-content:flex-start;gap:10px} }
.daily-main{max-width:840px;min-width:0}
.d-head{display:flex;align-items:flex-start;gap:12px}
.d-head h1{flex:1;min-width:0}
.meta-tog{border:none;background:none;min-height:0;padding:0 6px;margin-left:6px;color:var(--faint);font-size:15px;line-height:1;vertical-align:4px;border-radius:6px}
.meta-tog:hover{color:var(--accent);background:var(--accent-soft)}
.meta-tog span{display:inline-block;transition:transform .15s}
.meta-tog[aria-expanded=true] span{transform:rotate(180deg)}
.d-meta{margin:-2px 0 4px;color:var(--muted);font-size:13.5px}
.d-meta p{margin:6px 0}
.arch{position:relative;flex:none;margin-top:2px}
.arch-btn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 10px;font-size:13px;color:var(--ink2);background:var(--card)}
.arch-btn svg{width:15px;height:15px;color:var(--muted)}
.arch-btn:hover,.arch-btn[aria-expanded=true]{border-color:var(--accent-mid);color:var(--accent)}
.arch-btn .car{font-size:10px;color:var(--faint)}
.arch-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:236px;padding:12px;box-shadow:0 8px 24px rgba(16,24,40,.12)}
.arch-pop input[type=date]{width:100%;min-height:34px;padding:4px 8px}
.arch-k{font-size:12px;color:var(--muted);margin:10px 2px 4px}
.md .arch-pop ul,.arch-pop ul{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.md .arch-pop li{margin:0}
.arch-pop li a{display:flex;justify-content:space-between;padding:5px 8px;border-radius:7px;color:var(--ink);font-size:13.5px}
.arch-pop li a:hover{background:var(--bg);text-decoration:none}
.arch-pop li a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.arch-pop li a span{color:var(--muted);font-size:12px;font-weight:400}
.md{padding:26px 32px;overflow-wrap:anywhere}
.md h1{font-size:23px;margin:0 0 10px;line-height:1.35}
.md h2:first-of-type{border-top:none;margin-top:18px}
.md h2{font-size:18px;margin:30px 0 10px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:80px}
.md h3{font-size:16px;margin:18px 0 8px}
.md blockquote{margin:10px 0 14px;padding:10px 14px;background:var(--bg);border-left:3px solid var(--accent);border-radius:6px;color:var(--muted);font-size:13.5px}
.md ul,.md ol{padding-left:22px;margin:6px 0}.md li{margin:5px 0}
.md li ul{margin:4px 0}
.md hr{border:none;border-top:1px dashed var(--line);margin:22px 0}
.md p{margin:10px 0}.md code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:.92em}
.md ul+p,.md ol+p{margin-top:20px}
.md .lead{color:var(--ink)}.md .lbl{color:var(--ink);font-weight:700;margin-right:2px}

/* ---------- 动态追踪 ---------- */
.track{max-width:880px;margin:0 auto}
.fbar{display:grid;grid-template-columns:minmax(0,1.7fr) repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:center}
.fsearch{position:relative}
.fsearch input{width:100%;padding-left:34px}
.fsearch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint);pointer-events:none}
.fbar select{width:100%}
.fbar select.set{border-color:var(--accent-mid);color:var(--accent);font-weight:600}
.morebtn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink2)}
.morebtn:hover{border-color:var(--accent-mid)}
.morebtn[aria-expanded=true]{border-color:var(--accent-mid);color:var(--accent);background:var(--accent-soft)}
.morebtn .cnt{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;line-height:16px;min-width:16px;padding:0 5px;text-align:center}
.morebtn .car{font-size:10px;transition:transform .15s}.morebtn[aria-expanded=true] .car{transform:rotate(180deg)}
.morepanel{margin-top:10px;padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:16px 32px}
.mp-f{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start}
.mp-f>.k{font-size:13px;color:var(--muted);padding-top:5px}
.mp-f.wide{grid-column:1/-1}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{min-height:30px;padding:3px 11px;border-radius:999px;font-size:13px;color:var(--ink2);background:var(--card)}
.pills button:hover{border-color:var(--accent-mid)}
.pills button.on{background:var(--accent-soft);border-color:var(--accent-mid);color:var(--accent);font-weight:600}
.mp-f select{width:100%;max-width:260px}
.dates{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dates input{min-height:34px;padding:4px 8px}
.legend{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.fchip{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;line-height:24px;padding:0 4px 0 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.fchip .k{color:var(--muted);margin-right:2px}
.fchip button{border:none;background:none;min-height:0;padding:0 5px;color:var(--accent);font-size:15px;line-height:22px;border-radius:999px}
.fchip button:hover{background:var(--card)}
.chips .linkbtn{font-size:12.5px;margin-left:6px}
.meta{display:flex;align-items:center;gap:14px;margin:22px 2px 10px;font-size:12.5px;color:var(--muted)}
.meta .sp{flex:1}
.meta b{color:var(--ink);font-weight:600}
.meta .linkbtn{color:var(--muted)}.meta .linkbtn:hover{color:var(--accent)}

/* 信源身份：状态徽章下方的浅靛蓝小标签（官方账号稍深，官方人员更浅，第三方不标注） */
:root{--off-bg:#e8e7fc;--off-ink:#4338ca;--staff-bg:#f3f2fe;--staff-ink:#6d68e0}
@media (prefers-color-scheme:dark){:root{--off-bg:#2a2b5c;--off-ink:#b4b0ff;--staff-bg:#202246;--staff-ink:#9a96f0}}
.rtag{display:inline-block;padding:0 6px;border-radius:999px;font-size:11.5px;line-height:19px;font-weight:600;white-space:nowrap;text-align:center}
.rtag-off{background:var(--off-bg);color:var(--off-ink)}.rtag-staff{background:var(--staff-bg);color:var(--staff-ink)}

/* 按日期分组的列表 */
.day{margin-bottom:22px}
.day-h{display:flex;align-items:baseline;gap:10px;margin:0 2px 8px;font-size:14px;font-weight:600;color:var(--ink)}
.day-h .wk{font-weight:400;color:var(--muted);font-size:13px}
.day-h .n{margin-left:auto;font-weight:400;color:var(--faint);font-size:12px}
.day-list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.day-list .ev+.ev{border-top:1px solid var(--line2)}

/* 事件行（紧凑） */
.ev{position:relative}
.ev-row{display:grid;grid-template-columns:62px minmax(0,1fr) 16px;grid-template-areas:"st who chev" "st sum chev";gap:2px 12px;padding:13px 18px 13px 18px;cursor:pointer;align-items:start}
.ev-row:hover{background:color-mix(in srgb,var(--bg) 55%,transparent)}
.ev-st{grid-area:st;padding-top:2px;display:flex;flex-direction:column;align-items:stretch;gap:4px}
.ev-st .badge,.ev-st .rtag{text-align:center;padding:0 4px}
.ev-who{grid-area:who;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px;min-width:0}
.ev-who .co{font-weight:600;color:var(--ink)}
.ev-who .prod{font-weight:600;color:var(--accent)}
.ev-who .topic{color:var(--muted)}
.ev-who .dot-sep{color:var(--faint)}
.ev-who .type{margin-left:2px}
.relmark{font-size:11px;line-height:17px;padding:0 6px;border-radius:999px;border:1px dashed var(--faint);color:var(--muted)}
.ev-sum{grid-area:sum;margin:0;color:var(--ink2);max-width:42em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev-merge .ev-row{grid-template-areas:"st who chev" "st sum chev" "st src chev"}
.ev-merge .ev-sum{-webkit-line-clamp:4}
.ev-src{grid-area:src;margin:4px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.src-line{display:flex;flex-flow:row nowrap;align-items:baseline;gap:0 10px;min-width:0}
.src-more{flex:0 0 auto;margin:0;min-width:0}
.src-name{font-family:inherit;font-size:12.5px;font-weight:600;font-style:normal;line-height:1.45;letter-spacing:0;color:var(--accent)}
.src-more summary.src-name{display:inline;cursor:pointer;list-style:none}
.src-more summary.src-name::-webkit-details-marker{display:none}
.src-line .cnt{flex:0 0 auto;font-family:inherit;font-size:12.5px;font-weight:400;line-height:1.45;color:var(--faint);white-space:nowrap}
.src-pop{display:none}
.src-more[open] .src-pop{display:flex;flex-direction:column;gap:2px;margin-top:4px;max-width:36em}
.src-pop a{font-family:inherit;font-size:12.5px;font-weight:500;line-height:1.4;white-space:normal}
.story-why{margin:0;color:var(--muted);font-size:12.5px}
.chev{grid-area:chev;color:var(--faint);font-size:11px;padding-top:4px;transition:transform .15s;text-align:center}
.ev.open .chev{transform:rotate(90deg)}
.ev.open .ev-sum{-webkit-line-clamp:unset;display:block}
.ev.open>.ev-row{background:color-mix(in srgb,var(--bg) 40%,transparent)}

/* 展开详情 */
.ev-body{padding:4px 18px 18px 92px;font-size:14px;max-width:calc(42em + 110px)}
.ev-body>*+*{margin-top:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 18px;margin:0}
.kv div{border-left:2px solid var(--line);padding:1px 0 1px 10px}
.kv dt{font-size:12px;color:var(--muted)}.kv dd{margin:0;font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.conflict{background:var(--amber-bg);color:var(--ink2);padding:8px 12px;border-radius:8px;font-size:13.5px}
.conflict b{color:var(--amber)}
.drow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;font-size:13.5px}
.drow>.k{color:var(--muted);font-size:12.5px;padding-top:1px}
.hist{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.hist .arr{color:var(--faint)}.hist .d{color:var(--muted);font-size:12.5px}
.srcs{list-style:none;margin:0;padding:0}
.srcs li{padding:3px 0;overflow-wrap:anywhere}
.srcs .by{color:var(--faint);font-size:12px;margin-left:6px;white-space:nowrap}
.ev-links{font-size:13px;color:var(--muted);padding-top:10px;border-top:1px dashed var(--line)}
.ev-links a{margin-right:14px}

/* 时间线视图 */
.pin{padding:20px 24px;margin-top:18px}
.pin-k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.5px}
.pin h2{margin:2px 0 4px;font-size:22px;line-height:1.3}
.pin-sub{font-size:14px;color:var(--muted)}
.pin-sub a{font-weight:600}
.pin-facts{display:flex;flex-wrap:wrap;gap:10px 36px;margin:16px 0 0}
.pin-facts dt{font-size:12px;color:var(--muted)}.pin-facts dd{margin:2px 0 0;font-weight:600;font-size:14px}
.pin-facts .wide{flex-basis:100%}
.pin-facts .wide dd{font-weight:400;color:var(--ink2)}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:2px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--card)}
.pchip:hover{border-color:var(--accent-mid);color:var(--accent);text-decoration:none}
.pchip .n{color:var(--faint);font-size:11.5px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:83px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl-node{display:grid;grid-template-columns:70px 28px minmax(0,1fr);align-items:start;margin-bottom:12px}
.tl-when{text-align:right;padding-top:12px;font-variant-numeric:tabular-nums;line-height:1.3}
.tl-when b{display:block;font-size:14px;color:var(--ink)}
.tl-when .yr{font-size:11.5px;color:var(--faint)}
.tl-when .full{display:none}
.tl-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin:18px auto 0;box-shadow:0 0 0 4px var(--bg);position:relative;z-index:1}
.tl-node.is-rel .tl-dot{background:var(--bg);border:1.5px solid var(--faint)}
.tl-node>.ev{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tl-node>.ev .ev-row{border-radius:var(--r)}
.tl-node.is-rel>.ev{border-style:dashed;background:transparent}

.more{text-align:center;margin:16px 0}
.more button{padding:7px 18px}
.foot{color:var(--muted);font-size:12.5px;padding-bottom:30px;max-width:1120px}
.foot .w{color:var(--amber)}

@media (max-width:860px){
  .wrap{padding:0 14px}
  .top{position:static}
  .top-inner{height:auto;flex-wrap:wrap;gap:0 16px;padding-top:10px}
  .status-strip{gap:10px;font-size:11.5px}
  .tabs{order:3;width:100%;height:42px;margin:4px -12px 0;padding:0 2px}
  main.wrap{padding-top:16px}
  .dtoc nav{top:16px;min-height:calc(100vh - 16px - 28px)}
  .md{padding:18px 16px}
  .fbar{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .fsearch{grid-column:1/-1}
  .morebtn{grid-column:1/-1;justify-content:center}
  .fbar select{font-size:13.5px;padding-left:9px}
  .morepanel{grid-template-columns:1fr;padding:14px;gap:14px}
  .mp-f{grid-template-columns:1fr;gap:6px}
  .mp-f>.k{padding-top:0}
  .mp-f select{max-width:none}
  .ev-row{grid-template-columns:58px minmax(0,1fr) 14px;grid-template-areas:"st who chev" "st sum sum";padding:12px 14px;gap:4px 10px}
  .ev-merge .ev-row{grid-template-areas:"st who chev" "st sum sum" "st src src"}
  .ev-st{padding-top:1px}
  .ev-body{padding:2px 14px 16px 14px}
  .drow{grid-template-columns:1fr;gap:2px}
  .pin{padding:16px}
  .pin h2{font-size:20px}
  .pin-facts{gap:10px 24px}
  .tl::before{left:5px}
  .tl-node{grid-template-columns:20px minmax(0,1fr);grid-template-areas:"dot when" "dot card"}
  .tl-when{grid-area:when;text-align:left;padding:0 0 4px}
  .tl-when b,.tl-when .yr{display:none}
  .tl-when .full{display:inline;font-size:12.5px;color:var(--muted);font-weight:600}
  .tl-dot{grid-area:dot;margin:6px 0 0 1px}
  .tl-node>.ev{grid-area:card}
}

/* 手机：目录收成正文上方的一行横向小标签（吸顶，可左右滑动） */
@media (max-width:767px){
  .daily-layout{grid-template-columns:minmax(0,1fr);gap:10px}
  .dtoc{position:sticky;top:0;z-index:10;align-self:start;background:var(--bg);margin:0 -14px;padding:6px 14px}
  .dtoc nav{position:relative;min-height:0;flex-direction:row;justify-content:flex-start;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0}
  .dtoc .trk,.dtoc .nd{display:none}
  .dtoc nav::-webkit-scrollbar{display:none}
  .dtoc a{flex:none;margin:0;padding:3px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12.5px;white-space:nowrap}
  .dtoc a.done{color:var(--muted)}
  .dtoc a.on{border-color:var(--accent-mid);background:var(--accent-soft)}
  .d-head{gap:8px}
  .md h1{font-size:20px}
  .arch-btn{padding:4px 8px}
  .arch-pop{width:min(236px,calc(100vw - 40px))}
}

/* 产品能力的样式在 templates/cap.css（构建时接在这里） */

/* ---------- 产品能力（v5：图表 / 表格） ---------- */
/* 产品能力页整体放宽到 1180（页头、页脚一起） */
body.wide .wrap{max-width:1228px}
:root{--ref:#d3d7df;--ref-ink:#b9bec9;--zebra:#f7f8fb}
@media (prefers-color-scheme:dark){:root{--ref:#3a4058;--ref-ink:#566080;--zebra:#1b2033}}
.cap{margin:0 auto}
svg.defs{position:absolute;width:0;height:0;overflow:hidden}
.cap-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cap-seg{display:inline-flex;gap:2px;padding:3px;background:var(--line2);border:1px solid var(--line);border-radius:11px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.cap-seg::-webkit-scrollbar{display:none}
.cap-seg button{flex:none;border:none;background:none;min-height:34px;padding:5px 14px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.cap-seg button:hover{color:var(--ink)}
.cap-seg button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.cap-seg .n{margin-left:6px;font-size:12px;font-weight:500;color:var(--faint)}
.cap-seg button.on .n{color:var(--accent-mid)}
.cap-metrics{display:flex;flex-wrap:wrap;align-items:center;width:100%;max-width:100%;margin:0 0 14px;overflow:visible;box-sizing:border-box}
.cap-metrics button{font-size:13.5px;padding:5px 12px}
.cap-metrics.grouped{flex-direction:column;align-items:stretch;gap:8px;padding:0;background:none;border:none;border-radius:0}
.cap-mg{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 8px;min-width:0;max-width:100%}
.cap-mg-k{flex:none;margin-top:9px;min-width:5.5em;font-size:12.5px;font-weight:600;color:var(--muted)}
.cap-mg .cap-seg{display:flex;flex-wrap:wrap;flex:1;min-width:0;max-width:100%;overflow:visible}
/* 图表 / 表格 切换 */
.vt{display:inline-flex;gap:2px;padding:3px;margin-left:auto;background:var(--line2);border:1px solid var(--line);border-radius:10px;flex:none}
.vt button{border:none;background:none;min-height:30px;padding:3px 13px;border-radius:7px;color:var(--muted);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.vt button:hover{color:var(--ink)}
.vt button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.vt svg{width:14px;height:14px}
.cap-note{margin:10px 2px 12px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.cap-note .lg{display:inline-flex;align-items:center;gap:5px}
.cap-note .upd{margin-left:auto;color:var(--faint)}
/* 来源小标签：写全称「官方」「第三方」 */
.tg{display:inline-block;flex:none;font-size:10.5px;line-height:16px;padding:0 5px;border-radius:4px;font-weight:600;white-space:nowrap;letter-spacing:.2px}
.tg-o{background:var(--off-bg);color:var(--off-ink)}
.tg-3{background:var(--gray-bg);color:var(--gray)}
.cap-cols{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}
.cap-cols .k{font-size:12.5px;color:var(--muted);margin-right:4px}
.cchip{min-height:28px;padding:2px 11px;border-radius:999px;font-size:12.5px;color:var(--muted);background:var(--card)}
.cchip.on{background:var(--accent-soft);border-color:var(--accent-mid);color:var(--accent);font-weight:600}
.cap-cols .linkbtn{font-size:12.5px;margin-left:4px}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0;flex:none}
.co-lg{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;font-size:12px;color:var(--muted);margin:0 2px 10px}
/* 图表卡片 */
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.vc{padding:16px 18px 12px;min-width:0}
.vc.wide{grid-column:1/-1}
/* 功能覆盖约占 60%，驱动模型在右侧；窄屏上下叠 */
.feat-pair{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,3fr) minmax(220px,2fr);gap:16px;align-items:start}
.feat-pair>.vc{grid-column:auto;min-width:0}
.feat-pair [data-card="coverage"] svg.ch{width:100%;height:auto}
.vc-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 6px;margin-bottom:10px}
.vc-h h3{margin:0;font-size:15px;color:var(--ink);font-weight:600;display:flex;align-items:baseline;gap:0 2px;flex-wrap:wrap}
.vc-h .mn{color:var(--ink);font-weight:600}
.ar{font-size:12px;font-weight:700;color:var(--accent);margin-left:4px;cursor:help}
.mu{margin-left:6px;font-size:11.5px;color:var(--faint);font-weight:400;white-space:nowrap}
.info{border:none;background:none;min-height:0;padding:0 2px;margin-left:4px;color:var(--faint);font-size:12px;line-height:1;vertical-align:1px}
.info:hover{color:var(--accent)}
.norm{font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-bg);border-radius:5px;padding:0 6px}
.vc-f{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.5}
.vc-f .miss{color:var(--faint)}
.vc-src{font-size:11.5px;color:var(--faint);margin-top:4px;line-height:1.5}
.lgd{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.lgd i{display:inline-block;width:14px;height:8px;border-radius:2px}
.sw-s{background:var(--muted)}
.sw-h{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 60%,transparent) 0 2px,color-mix(in srgb,var(--muted) 14%,transparent) 2px 4.5px)}
.sw-u{background:var(--line2);outline:1px dashed var(--line)}
.lgd .dt-y,.lgd .dt-n,.lgd .dt-u{width:9px;height:9px;border-radius:50%}
.dt-y{background:var(--muted)}.dt-n{border:1.6px solid var(--faint);box-sizing:border-box}.dt-u{transform:scale(.55);background:var(--line)}
svg.ch{display:block;max-width:100%;overflow:visible}
svg.ch text{font-family:var(--font);fill:var(--ink2)}
svg.ch .ax{fill:var(--faint);font-size:11px}
svg.ch .lb{font-size:12.5px;fill:var(--ink2)}
svg.ch .lb.cov{font-size:14px}
svg.ch .lb.sm{font-size:11.5px}
svg.ch .lb.hd{font-weight:600;fill:var(--ink)}
svg.ch .lb.pt{font-size:12px}
svg.ch .vl{font-size:12px;font-weight:600;fill:var(--ink);font-variant-numeric:tabular-nums}
svg.ch .vs{font-size:11.5px;font-weight:500;fill:var(--muted);font-variant-numeric:tabular-nums}
svg.ch .dim{fill:var(--faint);font-weight:400}
svg.ch .good{font-size:12px;font-weight:600;fill:var(--accent);opacity:.85}
svg.ch .gl{stroke:var(--line2);stroke-width:1}
svg.ch .gl0{stroke:var(--line);stroke-width:1}
svg.ch .hit{cursor:pointer}
svg.ch .hit:hover .bar,svg.ch .hit:hover .dot{filter:brightness(1.08) saturate(1.1)}
svg.ch .hit:hover .lb{fill:var(--accent)}
.radar{display:flex;flex-direction:column;align-items:center;gap:6px}
.rlg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;font-size:13px;color:var(--ink2)}
.drv-l{margin:0}
.drv-l div{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.drv-l div:last-child{border-bottom:none}
.drv-l dt{flex:none;font-size:13px;color:var(--ink2)}
.drv-l dd{margin:0;flex:0 1 auto;min-width:0}
.cap-more{margin:12px 2px 0;font-size:12.5px}
.mini-scroll{overflow-x:auto}
.mini-t{border-collapse:collapse;width:100%;font-size:13px}
.mini-t th,.mini-t td{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
.mini-t thead th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.mini-t tbody th{font-weight:400;white-space:nowrap;width:1%}
.mini-t tbody tr:last-child>*{border-bottom:none}
.mini-t td.ref{opacity:.45}
@media (max-width:600px){.mini-t td{min-width:128px}}
/* 数值按钮：点开来源浮层 */
.cv{display:inline-flex;align-items:center;gap:5px;border:none;background:none;padding:1px 2px;margin:-1px -2px;min-height:0;border-radius:5px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.cv:hover{background:var(--accent-soft)}
.cv .n{font-variant-numeric:tabular-nums;color:var(--ink2)}
.cv.alt .n{color:var(--muted)}
.two{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px 4px}
.two .sep{color:var(--line);margin:0 1px}
.neq{display:inline-block;min-height:0;padding:0 2px;margin-left:3px;border:none;background:none;color:var(--amber);opacity:.8;font:600 13px/1 system-ui,sans-serif;cursor:pointer}
.neq:hover{opacity:1}
.mb{display:block;position:relative;height:3px;border-radius:2px;background:var(--line2);margin-top:6px;max-width:150px}
.mb i{position:absolute;left:0;top:0;height:100%;border-radius:2px}
.mb i.o{top:5px;height:3px;opacity:.35}
.mb.d{margin-bottom:5px}
.na{color:var(--faint);cursor:help}
.fv{border:none;background:none;min-height:0;padding:2px 6px;margin:-2px -6px;border-radius:5px;cursor:pointer}
.fv:hover{background:var(--accent-soft)}
.fl{font-weight:700;font-size:15px}.fl-y{color:var(--green)}.fl-n{color:var(--faint)}.fl-u{color:var(--line);font-weight:400}
.mchips,.plats{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px}
.mchip{display:inline-block;font-size:12px;line-height:20px;padding:0 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
a.mchip:hover{text-decoration:none;background:color-mix(in srgb,var(--accent-soft) 60%,var(--accent-mid))}
.mchip.plain{background:var(--line2);color:var(--ink2);font-weight:500}
.dsrc,.drv-na{border:none;background:none;min-height:0;padding:0 4px;font-size:11px;color:var(--faint);cursor:pointer;border-radius:4px}
.dsrc:hover,.drv-na:hover{color:var(--accent);background:var(--accent-soft)}
.drv-na{font-size:12.5px;color:var(--muted);padding:1px 6px;background:var(--line2)}
.plat{display:inline-block;font-size:11.5px;line-height:19px;padding:0 7px;border-radius:5px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
a.plat:hover{border-color:var(--accent-mid);color:var(--accent);text-decoration:none}
/* 表格视图 */
.cap-meta{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);margin:0 2px 8px}
.cap-meta b{color:var(--ink)}
.cap-hint{color:var(--accent);white-space:nowrap}
.cap-scroll{overflow:auto;max-height:calc(100vh - 150px);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overscroll-behavior-x:contain}
.cap-t{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.cap-t th,.cap-t td{padding:10px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle;background:var(--card)}
.cap-t thead th{position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line);vertical-align:bottom;padding-top:14px}
.cap-t .mcol{position:sticky;left:0;z-index:1;width:156px;min-width:156px;max-width:156px;font-weight:400;border-right:1px solid var(--line)}
.cap-t thead .corner{z-index:3;font-size:12px;color:var(--muted);font-weight:600}
.cap-t .pcol{min-width:140px}
.pname{border:none;background:none;padding:0;min-height:0;font-weight:700;font-size:14.5px;color:var(--ink);text-align:left;line-height:1.35}
.pname:hover{color:var(--accent);text-decoration:underline}
.pco{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px;padding-left:15px}
.cap-t tr.grp th,.cap-t tr.grp td{background:var(--bg);padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:.3px;border-bottom:1px solid var(--line)}
.mn{color:var(--ink);font-weight:500}
.cap-t td.v{font-variant-numeric:tabular-nums}
.cap-t td.v .cv{white-space:nowrap}
.cap-t td.v.txt .cv{white-space:normal}
/* 列多时两种来源上下排（第三方在上，官方在下），列少时并排「第三方 x ｜ 官方 y」 */
.cap-t.stack .two{display:inline-grid;gap:3px}
.cap-t.stack .two .sep{display:none}
.cap-t td.v.txt{min-width:120px;max-width:220px;line-height:1.45}
.cap-t td.best{background:color-mix(in srgb,var(--accent-soft) 70%,var(--card))}
.cap-t td.best .cv:first-child .n,.cap-t td.best .two .cv:first-child .n{font-weight:700;color:var(--ink)}
.cap-t td.fcell{padding-top:6px;padding-bottom:6px}
.cap-t tr.tr-drv td,.cap-t tr.tr-drv th{background:color-mix(in srgb,var(--accent-soft) 35%,var(--card))}
.cap-t td.plans{min-width:170px}
.cap-t tr.tr-plans>*{vertical-align:top}
.plans,.cap-t td.plans ul{list-style:none;margin:0;padding:0;font-size:13px}
.plans li{margin:0 0 4px}.plans li:last-child{margin:0}
.plans li b{font-weight:600;margin-right:4px}
.plans li .qn{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}
.plans .pl-a{color:inherit;text-decoration:none}
.plans .pl-a:hover b,.plans .pl-a:hover .pr,.plans .pl-a:hover .arr{color:var(--accent)}
.plans .pl-a .arr{font-size:11px;color:var(--faint);margin-left:3px}
.plans .pr{font-variant-numeric:tabular-nums}
.cap-t td.plans .qn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap-t tbody tr:last-child th,.cap-t tbody tr:last-child td{border-bottom:none}
.cap-t tbody tr:not(.grp):hover td,.cap-t tbody tr:not(.grp):hover th{background:color-mix(in srgb,var(--bg) 70%,var(--card))}
.cap-t tbody tr:not(.grp):hover td.best{background:color-mix(in srgb,var(--accent-soft) 90%,var(--card))}
/* 数据来源（默认收起） */
.cap-srcs{margin:14px 2px 0;font-size:12px;color:var(--muted);line-height:1.6}
.cap-srcs summary{cursor:pointer;font-weight:600;color:var(--ink2);width:max-content;list-style:none}
.cap-srcs summary::-webkit-details-marker{display:none}
.cap-srcs summary::before{content:"▸";display:inline-block;margin-right:6px;color:var(--faint);transition:transform .15s}
.cap-srcs[open] summary::before{transform:rotate(90deg)}
.cap-srcs ul{list-style:none;margin:6px 0 0;padding:0;columns:2 340px;column-gap:28px}
.cap-srcs li{break-inside:avoid;margin:0 0 2px}
.cap-srcs a{color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.cap-srcs a:hover{color:var(--accent);text-decoration-color:currentColor}
.cap-srcs .sn{color:var(--muted)}.cap-srcs .sep{color:var(--faint)}
.cap-card+.cap-srcs{max-width:860px;margin:14px auto 0}
/* 来源浮层 */
.cap-pop{position:fixed;z-index:60;width:300px;max-height:min(70vh,520px);overflow:auto;padding:12px 14px;font-size:13px;line-height:1.55;box-shadow:0 10px 30px rgba(16,24,40,.16)}
.cap-pop .pp-h{font-weight:600;color:var(--ink)}
.cap-pop .pp-u{font-size:13px;font-weight:500}
.cap-pop .pp-v{display:flex;align-items:center;gap:7px;font-size:18px;font-weight:700;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.cap-pop .pp-alt{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.cap-pop .pp-alt .pp-v{font-size:15px}
.cap-pop .pp-sep{height:1px;background:var(--line);margin:10px 0}
.cap-pop .pp-k{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.cap-pop .neq-k{font-weight:600;color:var(--amber)}
.cap-pop .pp-link{font-size:12.5px}
.cap-pop dl{margin:0 0 6px}.cap-pop dl div{display:grid;grid-template-columns:40px 1fr;gap:6px}
.cap-pop dt{color:var(--muted)}.cap-pop dd{margin:0;color:var(--ink2)}
.cap-pop p{margin:4px 0}
.cap-pop .pp-models{list-style:none;margin:6px 0;padding:0}.cap-pop .pp-models li{margin:0 0 4px}
.cap-pop .pp-models span{display:block;font-size:12px;color:var(--muted)}
/* 产品卡片 */
.cap-card{padding:24px 28px;max-width:860px;margin:0 auto}
.cap-card .back{font-size:13px;color:var(--muted)}.cap-card .back:hover{color:var(--accent)}
.cap-card .pin-k{margin-top:14px}
.cap-card h2{margin:2px 0 4px;font-size:24px}
.cap-card .pin-sub .dot-sep{margin:0 8px;color:var(--faint)}
.cc-sum{color:var(--ink2);max-width:42em;margin:12px 0}

.cc-kv{margin:10px 0 4px;display:grid;gap:6px}.cc-kv div{display:flex;align-items:center;gap:12px}
.cc-kv dt{font-size:12.5px;color:var(--muted);width:56px;flex:none}.cc-kv dd{margin:0}

.cc-g{margin-top:22px}

.cc-sc svg.ch{margin-top:6px}
.cc-dl{margin:0}
.cc-dl .r{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;padding:9px 0;border-bottom:1px solid var(--line2)}
.cc-dl .r:last-child{border-bottom:none}
.cc-dl dt{color:var(--ink2);font-size:14px}
.cc-dl dd{margin:0}
.cc-dl .vals{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.cc-dl .vals .cv .n{font-weight:700;font-size:15px;color:var(--ink)}

.cc-dl .sl{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin-top:4px}
.cc-dl .sl .sv{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.src-line{font-size:12.5px;color:var(--muted)}

.fnote{font-size:13px;color:var(--ink2)}
.pin-k .sw{vertical-align:0}
.pin-sub .cap-link{margin-left:14px;font-weight:600}
@media (max-width:860px){
  .vgrid{grid-template-columns:1fr}
  .feat-pair{grid-template-columns:1fr}
  .cap-seg{display:flex;width:100%}
  .cap-seg button{padding:5px 11px;font-size:13.5px}
  .vt{margin-left:0}
  .cap-note .upd{margin-left:0}
  .cap-scroll{max-height:calc(100vh - 120px)}

  .mn{line-height:1.4}.mu{margin-left:4px;margin-right:2px}

  .cap-meta{flex-direction:column;gap:2px}

}
