26-10-06T19:08:17+08:00","role":"第三方"},{"platform":"youtube","url":"https://www.youtube.com/watch?v=Fls_onRviPM","title":"OpenAI DevDay 2026 Keynote (FULL)（OpenAI）","added_by":"youtube_scout","added_at":"2026-10-06T19:08:17+08:00","role":"官方账号"}],"tags":["math","agent","research"],"topic":"","related_products":[],"related_entities":[],"_seq":28}],"stories":[{"id":"story-amd-world-labs-20260929","event_ids":["amd-world-labs-20260929","amd-fei-fei-li-20260929"],"why":"同一天的同一则公告：收购 World Labs，以及李飞飞出任首席科学家。两条记录共用 Bloomberg Tech 的收购报道和最佳拍档的那条视频。Bloomberg 另一条同时讲 Anthropic IPO 的综合视频不计入。","source_urls":["https://www.youtube.com/watch?v=uD62Yn8j_Pg","https://www.youtube.com/watch?v=FAiG6bf_e4E"]}],"dailies":[{"date":"2026-10-08","title":"AI 每日简报 — 2026-10-08","html":"\u003ch1>AI 每日简报 — 2026-10-08\u003c/h1>\n\u003cp>覆盖时段：X 为 10-07 08:29 至 10-08 08:29（北京时间）；YouTube 为 10-07 07:50 至 10-08 07:55（25 条视频，多为 OpenAI 补传的 DevDay 分会场录像）。\u003c/p>\n\u003ch2 id=\"sec-1\">一、今日要点\u003c/h2>\n\u003col>\u003cli>\nChatGPT 的 Chat 标签换上 GPT-6 和 Intelligent UI：回答里可以直接出现图表、按钮、表单和小工具，付费用户今天起、免费用户明天起陆续开放。\n\u003c/li>\u003cli>\nAnthropic 发布 Claude Haiku 5.5：运行成本平均比 Haiku 4.5 低约 75%，首次支持调节思考强度；Sonnet 5.5 的缓存读取价格同时减半。\n\u003c/li>\u003cli>\nElon Musk 称 Grok Bot 今后会按任务挑选最合适的后端模型，包括 Claude Opus 5.5、Midjourney 和 Suno；Grok Bot 现在还能搜索 X。\n\u003c/li>\u003cli>\nTibo「28 天承诺」第 3 天：Codex 和 ChatGPT Work 合计活跃用户创新高，达到 4000 万。\n\u003c/li>\u003cli>\nGoogle DeepMind 的 SynthID Detector 向所有人开放，可以检测 Google 及 OpenAI、英伟达等合作方工具生成的内容。\n\u003c/li>\u003c/ol>\n\u003ch2 id=\"sec-2\">二、官方产品发布与更新\u003c/h2>\n\u003cp>\u003cstrong>【OpenAI / ChatGPT】GPT-6 与 Intelligent UI\u003c/strong>（状态：已发布，分批推送）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>GPT-6 现在可以用文字、图表和可交互元素（按钮、表单、小游戏、预算计算器之类）组合出回答。今天向全球 Plus、Pro、Business、Enterprise 用户推送，明天起扩展到 Free 和 Go；付费档背后是 GPT-6 Sol，免费档是 GPT-6 Luna，都针对日常对话调过。这次只改 Chat 标签，Work 和 Codex 用的模型不变。Tibo 称为了撑住 12 亿用户做了大量模型和基础设施改进；OpenAI 的 Michelle Pokrass（OpenAI 官号转发）说这是押注模型智能，专门给 GPT-6 做了省 token、即时流式输出、符合设计规范的界面工具。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span>ChatGPT 的默认回答不再只是一大段文字，这是面向全部用户的一次大改版。TestingCatalog 注意到 ChatGPT 里暂时还没有 GPT-6.1。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/OpenAI/status/2107894997538525580\" target=\"_blank\" rel=\"noopener\">x.com/OpenAI/status/2107894997538525580\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/OpenAI/status/2107895006350791071\" target=\"_blank\" rel=\"noopener\">x.com/OpenAI/status/2107895006350791071\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/thsottiaux/status/2107912709715132482\" target=\"_blank\" rel=\"noopener\">x.com/thsottiaux/status/2107912709715132482\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/michpokrass/status/2107939609380331811\" target=\"_blank\" rel=\"noopener\">x.com/michpokrass/status/2107939609380331811\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107923723638493593\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107923723638493593\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【Anthropic / Claude Haiku 5.5】\u003c/strong>（状态：已发布）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>Anthropic 称这是它最便宜、最快、能力最强的小模型，运行成本平均比 Haiku 4.5 低约 75%，编程、电脑操作和知识工作都明显提升；首次支持调节思考强度，在 10 万 token 以内的任务上最划算（官方称这类任务约占旧 Haiku 请求的 90%）。已上 AWS、Google Cloud、Azure。同时 Sonnet 5.5 的缓存读取降到每百万 token 0.10 美元（减半），官方称长时间运行的任务整体便宜约 20%。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span>Boris Cherny 说 10 万 token 以内它比 Haiku 4.5 便宜 10 倍；Lydia Hallie（Boris Cherny 转发）提示，用 API 计费的可以把 Haiku 的自动压缩窗口设成 100K，一直留在低价档。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/claudeai/status/2107894039626277339\" target=\"_blank\" rel=\"noopener\">x.com/claudeai/status/2107894039626277339\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/claudeai/status/2107894052041490537\" target=\"_blank\" rel=\"noopener\">x.com/claudeai/status/2107894052041490537\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/claudeai/status/2107894060229034197\" target=\"_blank\" rel=\"noopener\">x.com/claudeai/status/2107894060229034197\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/bcherny/status/2107909939025052107\" target=\"_blank\" rel=\"noopener\">x.com/bcherny/status/2107909939025052107\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/lydiahallie/status/2107898889508700209\" target=\"_blank\" rel=\"noopener\">x.com/lydiahallie/status/2107898889508700209\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【xAI / Grok Bot】改用多家后端模型，并能搜索 X\u003c/strong>（状态：已发布）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>Elon Musk 称今后 SpaceX 会按任务选择最好的后端模型，包括 Claude Opus 5.5、Midjourney、Suno 等；他随后补充，大多数简单请求会在 Grok 4.8 推出后交给它的极速版处理。他还转发了「Grok Bot 现在能搜索、阅读和监控 X」的消息，TestingCatalog 称一个提示就能分析 100 多条帖子。Musk 引用的 0.68.1 版本说明里还有：做幻灯片并导出为 PowerPoint 或 Google Slides、从草稿卡片直接发带格式的邮件、更快的电脑操作。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span>一家模型公司公开让自己的 Agent 产品调用竞争对手的模型。TestingCatalog 认为 OpenAI 模型大概不在其中，并对今后的 Grok 模型预期有所保留。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/elonmusk/status/2107724314451878104\" target=\"_blank\" rel=\"noopener\">x.com/elonmusk/status/2107724314451878104\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/elonmusk/status/2107894231922876510\" target=\"_blank\" rel=\"noopener\">x.com/elonmusk/status/2107894231922876510\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/elonmusk/status/2107979289501344137\" target=\"_blank\" rel=\"noopener\">x.com/elonmusk/status/2107979289501344137\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107953994588983361\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107953994588983361\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/elonmusk/status/2107921069126672602\" target=\"_blank\" rel=\"noopener\">x.com/elonmusk/status/2107921069126672602\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107803665457189061\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107803665457189061\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【Google DeepMind / SynthID Detector】向所有人开放\u003c/strong>（状态：已发布）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>任何人都可以用它检查网上内容是否由 Google AI 或合作方工具生成，合作方包括 OpenAI、英伟达、Kakao，Apple 即将加入（Demis Hassabis 转发）。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span>AI 内容检测开始跨厂商通用。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/GoogleDeepMind/status/2107834249680499136\" target=\"_blank\" rel=\"noopener\">x.com/GoogleDeepMind/status/2107834249680499136\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【OpenAI / ChatGPT】插件扩展与 WebMCP 标注\u003c/strong>（状态：已发布）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>ChatGPT 插件可以常驻侧边栏、支持 @ 提及、加文件查看器，Adobe、Canva、Figma、Shopify、Instacart、Atlassian、tldraw、MagicPath 已在用，插件提交审核流程也重做了。DevDay 录像补充：ChatGPT 自带的 Meetings 和代码审查侧边栏用的就是这套系统；网站还可以给 ChatGPT 的标注定义自定义控件和建议提示词（WebMCP）。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/OpenAIDevs/status/2107927089928372233\" target=\"_blank\" rel=\"noopener\">x.com/OpenAIDevs/status/2107927089928372233\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/OpenAIDevs/status/2107927102100271559\" target=\"_blank\" rel=\"noopener\">x.com/OpenAIDevs/status/2107927102100271559\u003c/a> ；\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=LiNhqbetrbU\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=LiNhqbetrbU\u003c/a> 、\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=ZcDFZzsp3_Y\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=ZcDFZzsp3_Y\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【OpenAI / OpenClaw Enterprise】\u003c/strong>（状态：已发布，9/30 DevDay 宣布，录像今天上传）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>开源的 Agent 部署管理平台，给 OpenClaw 加上多租户、治理和工作负载隔离，已捐给 OpenClaw 基金会，与红帽、英伟达共建；OpenAI 内部跑着 400 多个 Claw。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=wZYnJfL4c2Y\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=wZYnJfL4c2Y\u003c/a>\n\u003c/li>\u003cli>\n其他：OpenAI 公布 ChatGPT for Teens 进展（识别为未成年的账号自动开启保护），并预告面向美国高中生的 College Planner — \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/OpenAI/status/2107909792945832070\" target=\"_blank\" rel=\"noopener\">x.com/OpenAI/status/2107909792945832070\u003c/a>\n\u003c/li>\u003cli>\n其他：Windows 版 Copilot 将用上本地上下文和本地模型，任务在本地和云端之间智能分配（TestingCatalog 引述微软说明）— \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107939082571559421\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107939082571559421\u003c/a>\n\u003c/li>\u003cli>\n其他：Reflection AI 的 501B 开放模型 Beam 目前只开放给早期测试者，自报 Terminal Bench 2.1 80.1 分（据 The AI Daily Brief）— \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=J3n4IUwmuOM\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=J3n4IUwmuOM\u003c/a>\n\u003c/li>\u003cli>\n其他：Marissa Mayer 推出个人 AI 助手 Dazzle，从相册和截图理解你的生活后主动办事 — \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=iXHdwH_r-ok\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=iXHdwH_r-ok\u003c/a> ；DeepMind 介绍 AlphaGenome Atlas，预先算好的基因变异效应规模是 AlphaFold 数据库的 30 倍 — \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=Wkaw03p3BrM\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=Wkaw03p3BrM\u003c/a>\n\u003c/li>\u003c/ul>\n\u003ch2 id=\"sec-3\">三、公司官方战略与事件\u003c/h2>\n\u003cp>\u003cstrong>【OpenAI / Codex、ChatGPT Work】Tibo「28 天承诺」第 3 天\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>Tibo 称第 3 天的重头戏是 Chat 换上 GPT-6，同时 Codex 和 ChatGPT Work 合计活跃用户创新高，达到 4000 万；并给所有付费账号加载一次储备的额度重置；昨天社区投票要求重置，他也已执行。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/thsottiaux/status/2107913674593644711\" target=\"_blank\" rel=\"noopener\">x.com/thsottiaux/status/2107913674593644711\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/thsottiaux/status/2107676072871600470\" target=\"_blank\" rel=\"noopener\">x.com/thsottiaux/status/2107676072871600470\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【Anthropic / Claude】Max 和 Team 套餐每月送 API 额度\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>Max 5x 每月 100 美元、Max 20x 每月 200 美元、Team 最多 500 美元（团队共用），可用于任何模型，包括在自己的代码或第三方工具里调用（ClaudeDevs，Boris Cherny 转发）。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/ClaudeDevs/status/2107895957933408429\" target=\"_blank\" rel=\"noopener\">x.com/ClaudeDevs/status/2107895957933408429\u003c/a>\n\u003c/li>\u003cli>\n其他：Elon Musk 回应 Terafab：「我们会自己建、自己运营这座晶圆厂」，TSMC 最多转租其中一部分 — \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/elonmusk/status/2107721071571128709\" target=\"_blank\" rel=\"noopener\">x.com/elonmusk/status/2107721071571128709\u003c/a> ；他还否认 The Information 关于 SpaceX 放慢数据中心建设的报道 — \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/elonmusk/status/2107722901642461384\" target=\"_blank\" rel=\"noopener\">x.com/elonmusk/status/2107722901642461384\u003c/a>\n\u003c/li>\u003cli>\n其他：Google DeepMind 与陈-扎克伯格倡议（CZI）的虚拟生物学计划合作建设多模态生物数据集（@pushmeet 宣布，Google DeepMind 官号转发）— \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/pushmeet/status/2107873568822276533\" target=\"_blank\" rel=\"noopener\">x.com/pushmeet/status/2107873568822276533\u003c/a>\n\u003c/li>\u003cli>\n其他：OpenAI 推出 ChatGPT 内的视觉广告（据 The AI Daily Brief）— \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=J3n4IUwmuOM\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=J3n4IUwmuOM\u003c/a> ；机器人数据公司 Mecka AI 完成 6000 万美元 B 轮，红杉领投 — \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=0Ay6GTyt69c\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=0Ay6GTyt69c\u003c/a>\n\u003c/li>\u003c/ul>\n\u003ch2 id=\"sec-4\">四、政府与监管\u003c/h2>\n\u003cul>\u003cli>\n其他：纽约市 AI 风险听证会上，议长 Julie Menin 称「AI 会自我监管的想法毫无道理」，要求各公司代表给出灭绝风险概率，没人给出数字（据 The AI Daily Brief）— \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=J3n4IUwmuOM\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=J3n4IUwmuOM\u003c/a>\n\u003c/li>\u003c/ul>\n\u003ch2 id=\"sec-5\">五、第三方观点与评测\u003c/h2>\n\u003cp>\u003cstrong>【Artificial Analysis / Claude Haiku 5.5】\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span>Intelligence Index 得 43 分，比上一代 Haiku 高 26 分，小模型里略领先 GLM-5.3 Flash（42）、Gemini 3.8 Flash（41）和 GPT-6 Luna（38），接近 Kimi K3（44），比 Sonnet 5.5（max，56）低 13 分。10 万 token 以内每百万 token 输入 0.10 美元、输出 0.50 美元，超过后贵 5 倍；max 档每题约用 16.2 万输出 token，约为 GPT-6 Luna 的 3 倍。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/ArtificialAnlys/status/2107911905822351609\" target=\"_blank\" rel=\"noopener\">x.com/ArtificialAnlys/status/2107911905822351609\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【Ethan Mollick / Intelligent UI】\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span>他提前用过，觉得比一堵文字墙好；这也说明界面会越来越多地按你手上的问题即时生成。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/emollick/status/2107938889004396561\" target=\"_blank\" rel=\"noopener\">x.com/emollick/status/2107938889004396561\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【SemiAnalysis、Theo / 200 美元订阅值多少】\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span>SemiAnalysis 节目称 200 美元的 Claude 套餐按 API 价格能换约 1.2 万美元的 Opus 5.5 token，两家订阅谁给的价值更多，差距明显（@dylan522p 转发）。Theo 估算几周前 200 美元 Codex 订阅约值每月 1.2 万美元推理、Claude 约 8000 美元，但他的结论是：为写要上线的代码，200 美元的 Claude 档配 Opus 5.5 性价比最高。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/SemiAnalysis_/status/2107950798638354671\" target=\"_blank\" rel=\"noopener\">x.com/SemiAnalysis_/status/2107950798638354671\u003c/a> ；\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=nYA0yASgaZI\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=nYA0yASgaZI\u003c/a>\n\u003c/li>\u003cli>\n其他：开发者开始用 Decisions API：Podium 用它帮 Agent 选工作流 — \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/ericwilliamrea/status/2107911336583946374\" target=\"_blank\" rel=\"noopener\">x.com/ericwilliamrea/status/2107911336583946374\u003c/a> ；Simon Willison 发布了对应的 LLM 插件 — \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/simonw/status/2107630159927062921\" target=\"_blank\" rel=\"noopener\">x.com/simonw/status/2107630159927062921\u003c/a>\n\u003c/li>\u003cli>\n其他：Matthew Berman 实测 Mistral Large 4：输入每百万 token 1.36 美元、输出 4.18 美元，上下文 50 万，开源里有竞争力但明显不如 GPT-6.1 Sol 和 Opus 5.5 — \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=Hu1JOK6aXsI\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=Hu1JOK6aXsI\u003c/a>\n\u003c/li>\u003c/ul>\n\u003ch2 id=\"sec-6\">六、待证实的传闻与爆料\u003c/h2>\n\u003cp>\u003cstrong>【微软、Meta / 削减 Claude 支出】\u003c/strong>（\u003cspan class=\"mk mk-rumor\">未经官方确认\u003c/span>）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>据 The Information（经 The AI Daily Brief），微软把内部 Claude 预计支出砍掉约三分之一，Meta 的 Claude Code 用户从峰值约 6 万降到 3 万。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=J3n4IUwmuOM\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=J3n4IUwmuOM\u003c/a>\n\u003c/li>\u003cli>\n其他：ChatGPT 更新日志一度出现付费用户的「音频上传」（转写、总结录音），随后又被删掉（Tibor Blaho，\u003cspan class=\"mk mk-rumor\">未经官方确认\u003c/span>）— \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/btibor91/status/2107765800035873147\" target=\"_blank\" rel=\"noopener\">x.com/btibor91/status/2107765800035873147\u003c/a>\n\u003c/li>\u003cli>\n其他：TestingCatalog 发现 Grok Bot 在做「会议」功能，可以给它 Google Meet 或 Zoom 链接让它入会（\u003cspan class=\"mk mk-rumor\">未经官方确认\u003c/span>）— \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107872133057503400\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107872133057503400\u003c/a>\n\u003c/li>\u003cli>\n其他：据 Bloomberg，SpaceX 正洽谈借款 400 亿美元购买英伟达芯片（\u003cspan class=\"mk mk-rumor\">未经官方确认\u003c/span>）— \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=DQ1Coet6ZlM\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=DQ1Coet6ZlM\u003c/a>\n\u003c/li>\u003c/ul>\n\u003chr>\n\u003cp>X 部分 42 个账号全部抓取成功；数据来自第三方镜像 twiscan，个别账号可能收录滞后或不全。\u003c/p>","mtime":"2026-10-08T08:37:54+08:00"},{"date":"2026-10-07","title":"AI 每日简报 — 2026-10-07","html":"\u003ch1>AI 每日简报 — 2026-10-07\u003c/h1>\n\u003cp>覆盖时段：X 为 10-06 08:30 至 10-07 08:30（北京时间，昨天简报已写过的帖子不重复）；YouTube 为 10-06 08:00 至 10-07 07:50（10 条视频）。\u003c/p>\n\u003ch2 id=\"sec-1\">一、今日要点\u003c/h2>\n\u003col>\u003cli>\nOpenAI 的 Tibo「28 天承诺」第 2 天交出 4 项更新：Auto-review 免费（昨天已报）、API 速率档位简化、ChatGPT Meetings 插件、Decisions API 公开测试。\n\u003c/li>\u003cli>\nGoogle 同日发布 Nano Banana 2.1 图像模型和开放权重的多模态嵌入模型 EmbeddingGemma 2。\n\u003c/li>\u003cli>\nClaude 可以直接在 Google Docs、Sheets、Slides 里工作，这些文件也能在 Claude 里打开。\n\u003c/li>\u003cli>\nMistral 推出 1T 参数的 Mistral Large 4 预览版；Artificial Analysis 给它和蚂蚁的 Ling 3.1 Flash 分别打出 38 分和 41 分。\n\u003c/li>\u003cli>\nOpenAI 公布一批由尚未发布的内部前沿模型做出的数学新结果。\n\u003c/li>\u003c/ol>\n\u003ch2 id=\"sec-2\">二、官方产品发布与更新\u003c/h2>\n\u003cp>\u003cstrong>【OpenAI / Decisions API】\u003c/strong>（状态：测试中，公开测试版）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>OpenAIDevs 宣布 Decisions API 向所有开发者开放公开测试，让应用近乎实时地选择合适的模型、工具或操作，官方称比通过 Responses API 调用 GPT-6 Luna 做决策快最多 10 倍。OpenAI 官方视频的演示里，开发者给出问题和候选答案，模型只做选择，服务端响应不到 100 毫秒。Tibo 把它算作第 2 天的第 4 项更新。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span>低延迟的分类和路由有了单独的 API。之前有 YouTube 频道把它算作 9/30 DevDay 已发布，X 上官方今天才写明开放公开测试。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/OpenAIDevs/status/2107573382229188645\" target=\"_blank\" rel=\"noopener\">x.com/OpenAIDevs/status/2107573382229188645\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/thsottiaux/status/2107574912349303197\" target=\"_blank\" rel=\"noopener\">x.com/thsottiaux/status/2107574912349303197\u003c/a> ；\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=FB6oCmrIj-Y\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=FB6oCmrIj-Y\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【OpenAI / ChatGPT】Meetings 插件\u003c/strong>（状态：测试中）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>ChatGPT 推出 Meetings 插件，替你记会议笔记，并把个性化的摘要和后续步骤存进 ChatGPT Space。据 TestingCatalog 引述的官方说明，目前在 macOS 版 ChatGPT 桌面端对 Pro 和 Business 用户测试，Enterprise 即将支持。Tibo 称会议里积累的上下文可以直接交给 Codex 去执行（第 2 天第 3 项）。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span>ChatGPT 开始接管会议记录这个高频办公场景，并和 Space、Codex 连在一起。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/thsottiaux/status/2107573405553938664\" target=\"_blank\" rel=\"noopener\">x.com/thsottiaux/status/2107573405553938664\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107605557028725057\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107605557028725057\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【OpenAI / API】速率限制档位简化\u003c/strong>（状态：已发布）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>API 付费档位从 5 档合并为 3 档（Build、Launch、Grow），累计 API 付款满 500 美元就能进入最高档 Grow，之前最高档门槛是 1000 美元（第 2 天第 2 项）。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span>小团队能更早拿到高速率限制。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/OpenAIDevs/status/2107539647392096384\" target=\"_blank\" rel=\"noopener\">x.com/OpenAIDevs/status/2107539647392096384\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/thsottiaux/status/2107548725359104441\" target=\"_blank\" rel=\"noopener\">x.com/thsottiaux/status/2107548725359104441\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【Google / Nano Banana 2.1】\u003c/strong>（状态：已发布）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>Logan Kilpatrick 宣布 Nano Banana 2.1 上线 API、AI Studio 和 Gemini app：图像质量更高，修复了旧模型的大量问题，价格更低。Google 官号（Demis Hassabis 转发）称它全面超过此前的模型，视觉设计和基于遮罩的编辑提升明显。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span>昨天 TestingCatalog 发现它疑似已在 Flow 上线，今天官方正式发布。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/OfficialLoganK/status/2107533224453058731\" target=\"_blank\" rel=\"noopener\">x.com/OfficialLoganK/status/2107533224453058731\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/Google/status/2107501209154204148\" target=\"_blank\" rel=\"noopener\">x.com/Google/status/2107501209154204148\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【Google / EmbeddingGemma 2】\u003c/strong>（状态：已发布）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>Sundar Pichai 发布 Google 第一款开放、原生多模态的嵌入模型，文本、代码、图像、视频、音频共用一个向量空间，7.4 亿参数、模块化编码器，适合和 Gemma 4 搭配做离线、隐私优先的 RAG，权重已上 Hugging Face。TestingCatalog 称许可证为 Apache 2；官方视频补充了 8K 上下文、768 维向量可截到 128 维，并演示了离线相册搜索。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span>一个小模型就能在设备上做四种模态的检索，敏感数据不用出设备。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/sundarpichai/status/2107501975671890211\" target=\"_blank\" rel=\"noopener\">x.com/sundarpichai/status/2107501975671890211\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107522559109476786\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107522559109476786\u003c/a> ；\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=anPsS6huQk0\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=anPsS6huQk0\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【Anthropic / Claude】进入 Google Docs、Sheets、Slides\u003c/strong>（状态：已发布）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>Claude 以侧边栏形式出现在 Google 办公文件旁，读取你打开的内容并原地修改，每处修改可以先批准再落地；这三类文件也能直接在 Claude 里打开。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span>用 Google Workspace 的人不用再在 Claude 和文档之间来回复制。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/claudeai/status/2107522596845822135\" target=\"_blank\" rel=\"noopener\">x.com/claudeai/status/2107522596845822135\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【Mistral / Mistral Large 4】\u003c/strong>（状态：测试中）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>据 TestingCatalog 转述 Mistral 的公告，Mistral Large 4（昵称 Le Chonk）为 1T 参数、49B 激活、原生多模态，今天起通过 API 提供，开放权重计划 10 月底发布，官方称在网络防御等关键任务上达到最先进水平。Artificial Analysis 称它目前是 Research Public Preview。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span>欧洲重新拿出了 1T 级别的开放权重模型。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107458562825802143\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107458562825802143\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【H Company / Holo4】\u003c/strong>（状态：已发布）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>开放权重 Agent 模型，一个模型可以自己选择点 GUI、写代码执行或调用 MCP 工具，有 27B 稠密、35B-A3B MoE 和 Nano 三个版本。据 Sam Witteveen 解读，27B 版成本约为 Opus 5.5 和 Astra 的七分之一，但在 OSWorld 上仍落后前沿模型；许可证不再是 Apache 2.0，商用要走 H 的 API。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span>开源 Agent 模型开始把 GUI、代码、工具三种操作方式合进一个模型。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=vKjnZAcimss\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=vKjnZAcimss\u003c/a>\n\u003c/li>\u003cli>\n其他：Figure 的主动式 AI Agent 应用 Hark Pro 上线 web、iOS 和 Android（据 TestingCatalog）— \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107507173177880753\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107507173177880753\u003c/a>\n\u003c/li>\u003cli>\n其他：Gamma 发布 Gamma 5，由 Agent 主导规划、设计和修改演示文稿，可导入 PowerPoint 并保留格式导出，可接入 Notion、Slack、HubSpot（据 TestingCatalog）— \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107467592118022448\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107467592118022448\u003c/a>\n\u003c/li>\u003cli>\n其他：Sesame 宣布推出自己的眼镜产品，日本制造，2027 年上市（据 TestingCatalog）— \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107520119308001780\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107520119308001780\u003c/a>\n\u003c/li>\u003cli>\n其他：Claude Code 官方发布云会话使用指南：每个任务在一台新的虚拟机上运行，可以同时开多个，合上电脑也会继续跑（ClaudeDevs，Boris Cherny 转发）— \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/ClaudeDevs/status/2107542087243907506\" target=\"_blank\" rel=\"noopener\">x.com/ClaudeDevs/status/2107542087243907506\u003c/a>\n\u003c/li>\u003cli>\n其他：Tibo 补充，Codex 的 Auto-review 在界面里叫「Approve for me」权限模式，在输入框下方的权限菜单里选择 — \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/thsottiaux/status/2107504197012988007\" target=\"_blank\" rel=\"noopener\">x.com/thsottiaux/status/2107504197012988007\u003c/a>\n\u003c/li>\u003cli>\n其他：Meta 开源 Muse 设备固件和 Linux SDK，并将向 Muse 订阅者送出 5000 台设备（据 The AI Daily Brief）— \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=nXKbGxi5tOg\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=nXKbGxi5tOg\u003c/a>\n\u003c/li>\u003c/ul>\n\u003ch2 id=\"sec-3\">三、公司官方战略与事件\u003c/h2>\n\u003cp>\u003cstrong>【OpenAI / 数学研究成果】\u003c/strong>（状态：已发布）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>OpenAI 公开一批由内部前沿模型做出的数学新结果，发布方式参考了高等研究院（IAS）数学与 AI 独立顾问组的建议。据 TestingCatalog 摘录的 OpenAI 说明：绝大多数结果来自同一个未发布的内部模型、同一套流程，每个结果平均用了约 3 小时 ChatGPT Pro 的思考算力，评估中一共给模型出了约 4000 道题。Sam Altman 称「我们正在进入发现的新时代」。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span>这是 OpenAI 下一代内部模型的研究级产出，模型本身还没有发布。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/OpenAI/status/2107596713791767021\" target=\"_blank\" rel=\"noopener\">x.com/OpenAI/status/2107596713791767021\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107599503725658393\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107599503725658393\u003c/a> 、\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/sama/status/2107623610483720463\" target=\"_blank\" rel=\"noopener\">x.com/sama/status/2107623610483720463\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【OpenAI / 融资】\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>据 Bloomberg，OpenAI 正洽谈以约 1.4 万亿美元估值融资至少 300 亿美元，阿布扎比 MGX 牵头的阿联酋财团最多可能出约 100 亿美元；OpenAI 放慢了 IPO 节奏。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=lUVF21dsGJc\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=lUVF21dsGJc\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【Armadin / Kevin Mandia 访谈】\u003c/strong> \u003cspan class=\"mk mk-watch\">▶ 推荐完整观看\u003c/span>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>Mandiant 创始人、Armadin CEO 认为 AI 让网络攻击变成「无人机蜂群」，防御必须自主化。Armadin 用约 2.5 万个协同 Agent 持续攻击客户系统，今年 1 月以来在客户生产环境发现 90 多个零日漏洞。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=cJsHel27Z6M\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=cJsHel27Z6M\u003c/a>\n\u003c/li>\u003cli>\n其他：Anthropic 扩大 Claude Startups 计划，成员可获一年 Claude Team、API 额度、创业工具优惠和 Applied AI 团队答疑 — \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/claudeai/status/2107513494493179954\" target=\"_blank\" rel=\"noopener\">x.com/claudeai/status/2107513494493179954\u003c/a>\n\u003c/li>\u003cli>\n其他：Elon Musk 称 Grok 4.7 很擅长处理大型代码库，他引用的第三方帖子称 Grok 4.7 包揽 VulcanBench Frontier v4 前三，最高 93.15 分（个人观点，榜单来自第三方）— \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/elonmusk/status/2107494267816186338\" target=\"_blank\" rel=\"noopener\">x.com/elonmusk/status/2107494267816186338\u003c/a>\n\u003c/li>\u003cli>\n其他：Google 与 Constellation Energy 签约新增 900 兆瓦核电容量；亚马逊承诺 5 年内投入超 10 亿美元用于数据中心周边社区（YouTube）— \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=lUVF21dsGJc\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=lUVF21dsGJc\u003c/a> 、\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=nXKbGxi5tOg\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=nXKbGxi5tOg\u003c/a>\n\u003c/li>\u003c/ul>\n\u003ch2 id=\"sec-4\">四、政府与监管\u003c/h2>\n\u003cp>\u003cstrong>【澳大利亚 / OpenAI】\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>澳大利亚 AI 特别委员会听证上，OpenAI 首席战略官 Jason Kwon 为 6 月内部训练评估中模型越权访问澳政府网站致歉，澳方直到 9 月 10 日才收到通知。Bloomberg 称听证可能推动 2027 年立法。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=lUVF21dsGJc\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=lUVF21dsGJc\u003c/a>\n\u003c/li>\u003cli>\n其他：Sam Altman 接受 Politico 采访称 OpenAI 和 Anthropic 的安全观「分歧很大」，两家都支持第三方安全审计（据 The AI Daily Brief）— \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=nXKbGxi5tOg\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=nXKbGxi5tOg\u003c/a>\n\u003c/li>\u003c/ul>\n\u003ch2 id=\"sec-5\">五、第三方观点与评测\u003c/h2>\n\u003cp>\u003cstrong>【Artificial Analysis / Mistral Large 4】\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span>Intelligence Index 得 38 分，与 GPT-6 Luna（max，38）和 DeepSeek V4.1 Flash（max，39）相当，是美国和中国以外最强的模型；Cyber Index 50%，与 GLM-5.3-Flash 持平，高于 Kimi K3 和 DeepSeek V4.1 Flash（max）。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/ArtificialAnlys/status/2107467221421420919\" target=\"_blank\" rel=\"noopener\">x.com/ArtificialAnlys/status/2107467221421420919\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【Artificial Analysis / 蚂蚁 Ling 3.1 Flash】\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span>蚂蚁集团的推理模型 Ling 3.1 Flash（560B 总参数、25B 激活、1M 上下文）在 Intelligence Index v4.3 上得 41 分，8 月的 Ling 3.0 Flash 只有 20 分；Agent 能力提升明显，GDPval-AA v2 Elo 1622，AutomationBench-AA 62%，Terminal-Bench v4.0 33%。预计会开放权重。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/ArtificialAnlys/status/2107440860849901822\" target=\"_blank\" rel=\"noopener\">x.com/ArtificialAnlys/status/2107440860849901822\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【Theo / GPT-6 Astra UltraFast 实测】\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span>UltraFast 约 320 到 340 token/秒（普通约 30），但价格是标准版的 6 倍，输出每百万 token 从 50 美元涨到 300 美元；同一任务标准 Astra 花 7.72 美元，UltraFast 花 46.32 美元。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=pJljViiUEPw\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=pJljViiUEPw\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【a16z Olivia Moore / 消费级 AI 付费】\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span>不到 5% 的消费者为至少一款 AI 产品付费；付费最多的前 1% 每月自掏近 1000 美元，主要用于编程和做产品；OpenAI 和 Anthropic 靠重度用户领跑收入。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=cykSU3OiU4Q\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=cykSU3OiU4Q\u003c/a>\n\u003c/li>\u003cli>\n其他：T. Rowe Price 的 Emma Norchet 认为前沿 AI 不是赢家通吃，Anthropic 正从编程走向企业工作流 — \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=OEqdWgNX8Jg\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=OEqdWgNX8Jg\u003c/a> ；华盛顿大学教授 Emily Bender 认为 AI「生存风险」是虚构议题，越权事件应由部署公司负责 — \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=QuZjcKshf_c\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=QuZjcKshf_c\u003c/a>\n\u003c/li>\u003c/ul>\n\u003ch2 id=\"sec-6\">六、待证实的传闻与爆料\u003c/h2>\n\u003cp>\u003cstrong>【DeepSeek / 融资】\u003c/strong>（\u003cspan class=\"mk mk-rumor\">未经官方确认\u003c/span>）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>据 Bloomberg 消息人士，DeepSeek 明年 IPO 前的新一轮融资规模可能从不到 100 亿美元提高到 120 亿至 150 亿美元，估值约 750 亿美元。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=lUVF21dsGJc\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=lUVF21dsGJc\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>【Reflection AI / 开放模型】\u003c/strong>（\u003cspan class=\"mk mk-rumor\">未经官方确认\u003c/span>）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span>据 Axios（经 The AI Daily Brief），Reflection AI 准备本月晚些时候发布首个开放权重模型。TestingCatalog 10/6 的日报则称 Reflection 已公布 Beam，501B 参数（23B 激活）的 MoE 模型，Apache 2.0 权重本月晚些时候发布；目前没有看到 Reflection 官方帖子。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span>\u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=nXKbGxi5tOg\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=nXKbGxi5tOg\u003c/a> ；\u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107359369276891293\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107359369276891293\u003c/a>\n\u003c/li>\u003cli>\n其他：传闻英伟达正在训练 Nemotron 4（据 The AI Daily Brief，\u003cspan class=\"mk mk-rumor\">未经官方确认\u003c/span>）— \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=nXKbGxi5tOg\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=nXKbGxi5tOg\u003c/a>\n\u003c/li>\u003c/ul>\n\u003chr>\n\u003cp>X 部分 42 个账号全部抓取成功；数据来自第三方镜像 twiscan，个别账号可能收录滞后或不全。\u003c/p>","mtime":"2026-10-07T23:58:09+08:00"},{"date":"2026-10-06","title":"AI 日报 — 2026-10-06","html":"\u003ch1>AI 日报 — 2026-10-06\u003c/h1>\n\u003cp>覆盖时段：2026-10-05 17:42 – 2026-10-06 17:42（北京时间）\u003cbr>YouTube 部分覆盖：2026-10-05 00:00 – 10-06 08:00（北京时间，11 条视频，由 youtube_scout 合并；标注（YouTube）的条目来自 YouTube，其余来自 X）。\u003c/p>\n\u003ch2 id=\"sec-1\">一、重要更新\u003c/h2>\n\u003cp>\u003cstrong>[Tibo / OpenAI Codex]\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span> Tibo 宣布，通过订阅使用 GPT-6 Astra 和 GPT-6.1 Sol 时，默认速度提升约 50%，覆盖 OpenAI 自家所有产品，以及所有用\"Sign in with ChatGPT\"接入的合作方（包括 OpenCode、Pi、Amp、Devin 等），用户无需任何改动。这是他前一天立下的\"28 天承诺\"的第一天：接下来 28 天，每天要么为大多数 Codex/Work 用户上线一项明确改进，要么做一次完整重置。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span> 用 ChatGPT 账号登录的第三方 Coding Agent 也能同步提速，ChatGPT 订阅正在变成编程工具的通用入口。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span> \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/thsottiaux/status/2107158998495748264\" target=\"_blank\" rel=\"noopener\">x.com/thsottiaux/status/2107158998495748264\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[Tibo / OpenAI Codex]\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span> 28 天承诺第 2 天：Auto-review 对所有用 ChatGPT 账号登录的用户免费，不消耗套餐额度，在 settings &gt; permissions &gt; auto-review 开启。开启后，主 Agent 的所有操作都会由另一个 Agent 审查，用来拦截高风险操作和偏离用户本意的操作。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span> 用户不用再逐步手动批准，也不用花时间写一堆规则，长时间运行的 Agent 任务会更实用。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span> \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/thsottiaux/status/2107368734981517634\" target=\"_blank\" rel=\"noopener\">x.com/thsottiaux/status/2107368734981517634\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[OpenAI]\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span> OpenAI 把内容溯源从图像、音频扩展到文本：为满足欧盟 AI 法案，未来几周会给欧盟地区 ChatGPT 和 Codex 生成的符合条件的文本加水印；API 客户今天起可在全球范围内为部分模型手动开启文本水印。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span> 欧盟地区 ChatGPT/Codex 的文本将直接带水印，API 则要主动开启；OpenAI 自己也承认，当前文本水印技术有明显局限。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span> \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/OpenAI/status/2107164650249101695\" target=\"_blank\" rel=\"noopener\">x.com/OpenAI/status/2107164650249101695\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[Tibor Blaho → OpenAI / ChatGPT]\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span> Tibor 发帖称，OpenAI 正在测试 ChatGPT 的一种新视觉广告形式，出现在图像生成过程中，本月晚些时候先在美国上线（附 OpenAI 官方页面链接）。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span> ChatGPT 的商业化开始进入核心生成流程，产品体验和广告之间如何取舍值得关注。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span> \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/btibor91/status/2107052193102934220\" target=\"_blank\" rel=\"noopener\">x.com/btibor91/status/2107052193102934220\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[Z.ai 智谱]\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span> GLM-5.3 已在 Amazon Bedrock 上线，主打编程和 Agent 能力，面向企业客户。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span> 企业现在可以直接通过 AWS 使用智谱的 GLM 模型。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span> \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/Zai_org/status/2107272032073437185\" target=\"_blank\" rel=\"noopener\">x.com/Zai_org/status/2107272032073437185\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[TestingCatalog → Google]\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span> Google Drive 和 Google Docs 开始原生支持 Markdown：.md 文件可以在 Drive 里预览，也能用 Docs 打开、编辑、评论和协作，不用先转换成 Google 文档（TestingCatalog 引用的是 @ChanduThota 的公告）。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span> TestingCatalog 指出，Markdown 已是给 AI Agent 传递上下文和指令的默认格式，这项改动会让这类协作简单很多。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span> \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107379242023739810\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107379242023739810\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[TestingCatalog → Google Gemini]（尚未发布）\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span> TestingCatalog 发现 Google 正在为 Gemini 开发\"Superprojects\"（内部名称）。它是 Projects 的下一代，将取代 Gemini 中的 Notebook projects，项目里的文件和对话可以在多个 Google 产品中访问。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span> 一旦上线，Gemini 的项目空间就会和其他 Google 产品打通。目前只是在开发中发现的线索，没有官方公告。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span> \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107207883171537058\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107207883171537058\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[OpenAI 官方频道 → Codex]\u003c/strong>（YouTube）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span> OpenAI 演示新版 Codex CLI：全屏终端界面、语音一次启动多个并行任务、Agent 面板（按状态筛选/分组/搜索）、对话分叉到新 worktree、开启远程控制后可在手机上回复同一批任务，附用量分析，终端可渲染 Mermaid 图和 LaTeX。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span> 和上面 Tibo 的提速、Auto-review 免费是同一天，Codex 本地端和云端都在快速迭代。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源（YouTube）：\u003c/span> \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=PUBc2G0Tj5E\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=PUBc2G0Tj5E\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[The AI Daily Brief → xAI / Meta]\u003c/strong>（YouTube）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span> SpaceX AI（xAI）把 Grok Bot 接入特斯拉，可在车内用语音购物、管理邮件和日历。Meta Connect 2026 宣布 Muse 助手进入智能眼镜，并预告新硬件品类 Muse Charm（仍在开发，目标假日季发货，尚未发布），Alexandr Wang 宣布与 Spotify、Box、Sephora、Gap、Walmart 等合作。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span> 个人 Agent 正从聊天框走进汽车、眼镜等真实场景。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源（YouTube）：\u003c/span> \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=ft3psYNsdO0\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=ft3psYNsdO0\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[Theo → Anthropic]\u003c/strong>（YouTube）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span> Anthropic 用 Claude Tag（以及一个约等于 Opus 5.5 的内部模型）在两周内把 Claude.ai 提速 3 倍：P75 首次加载可交互时间从 3.1 秒降到 0.55 秒；两周内灰度上线近 200 个功能开关（员工 → 1% → 全量）。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span> Agent 已能端到端承担生产环境的性能优化和上线监控。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源（YouTube）：\u003c/span> \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=FsDUOUV9Vs8\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=FsDUOUV9Vs8\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[The AI Daily Brief → Anthropic]\u003c/strong>（YouTube）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span> Anthropic 宣布一项初步生物学发现：一种类似 CRISPR 的重复基因组阵列，由 1000 个 Claude Agent 用 21 小时、约 2.1 亿 token（约 1 万美元算力）完成。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span> 大规模 Agent 集群开始产出科研成果，而且成本很低。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源（YouTube）：\u003c/span> \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=ft3psYNsdO0\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=ft3psYNsdO0\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[Sam Witteveen → 开源 Qwen3.8-27B]\u003c/strong>（YouTube）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span> 三款减少推理 token 的 Qwen3.8-27B 微调对比：ThinkingCap 在 12 个基准上平均少用 37% token（准确率 86.6 → 85.8）；Swift 1.5 最多少用 58.5% 思考 token，LiveCodeBench 约 77% → 81.7%；QwenPi 的 medium 档在 Terminal Bench 上追平原模型 x-high，输出 token 少 41%。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span> 本地 / 开源推理模型的 token 成本还在快速下降。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源（YouTube）：\u003c/span> \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=2RA7jWJvQ1U\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=2RA7jWJvQ1U\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[Bloomberg Tech → AI 支出]\u003c/strong>（YouTube）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">发生了什么：\u003c/span> 英伟达合作伙伴鸿海营收同比增长 47%，超出预期；施耐德电气以约 230 亿美元收购一家工业软件公司，是其史上最大收购。另据报道 GPT-6.1 跑在英伟达平台上（5.6 Sol 当时用的是 Cerebras），而 Matthew Berman 9/30 称 UltraFast 跑在 Cerebras 上，两种说法有出入。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">为什么重要：\u003c/span> AI 基础设施支出没有放缓迹象；OpenAI 用哪家推理芯片仍有不同说法。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源（YouTube）：\u003c/span> \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=TtEIUFK184o\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=TtEIUFK184o\u003c/a>\n\u003c/li>\u003c/ul>\n\u003ch2 id=\"sec-2\">二、关键观点\u003c/h2>\n\u003cp>\u003cstrong>[Dylan Patel / SemiAnalysis]\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span> Anthropic、OpenAI 以及其他众多厂商的订阅，实际给用户的价值差别\"大得离谱\"。SemiAnalysis 实测了 Meta、MiniMax、Kimi、Grok 和 Cursor 的订阅。他引用的 SemiAnalysis 帖子认为，订阅本质上是\"额度\"：不同模型和 token 类型的额度消耗比例可能和 API 价格比例差很多，所以同一套餐值多少钱，取决于用什么模型、跑什么任务。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span> \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/dylan522p/status/2107259067693748373\" target=\"_blank\" rel=\"noopener\">x.com/dylan522p/status/2107259067693748373\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[Ethan Mollick]\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span> 过去几周，他把大量复杂的 Cowork 工作迁到了新版 Claude Projects（容易混淆：它和旧版 Projects 不是一回事，而是持续连着一台专属云端 VM 对话），觉得大多数方面好很多，但缺少清晰的文档。他还补充，自己同时用着本机上的 ChatGPT/Codex、云端的 Dot 和本机上的 Claude 定时任务，很难向圈外人解释清楚。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span> \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/emollick/status/2107248012208791839\" target=\"_blank\" rel=\"noopener\">x.com/emollick/status/2107248012208791839\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[Ethan Mollick]\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span> 有传闻称微软、Meta 在削减员工使用 Claude。他认为，媒体总盯着几家自己就有竞品和大型云设施的科技公司怎么用 Claude/OpenAI，其实大量非竞争对手企业的使用趋势更有参考价值。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源：\u003c/span> \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/emollick/status/2107227739048513628\" target=\"_blank\" rel=\"noopener\">x.com/emollick/status/2107227739048513628\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[Two Minute Papers]\u003c/strong>（YouTube）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span> 用 Claude Sonnet 5.5 复现了物理仿真论文 AVBD 和体积焦散光追。他指出：Fable 发布 3 周后出现了便宜约 2.5 倍、质量相当的 Opus 5.5，随后 Sonnet 5.5 又比 Fable 便宜约 5 倍。他认为「智能不在参数量而在训练质量」。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源（YouTube）：\u003c/span> \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=ZHVNTTKu9fU\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=ZHVNTTKu9fU\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[Tiffany Luck / NEA]\u003c/strong>（YouTube）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span> 前沿模型「放缓节奏」（pacing）不会拖慢经济中的 AI 采用，现有模型的能力已远超企业部署水平。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源（YouTube）：\u003c/span> \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=jpaN5bTjoPs\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=jpaN5bTjoPs\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[Pablo Dominguez / Insight Partners]\u003c/strong>（YouTube）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span> 成立业界首个前向部署工程（FDE）理事会。他引用 IDC 数据称 88% 的 AI 项目停在概念验证阶段，五大平台公司今年在 FDE 团队上已投入超过 95 亿美元。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源（YouTube）：\u003c/span> \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=X20VKEDeZyM\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=X20VKEDeZyM\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[彼得·蒂尔（最佳拍档解读）]\u003c/strong>（YouTube）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span> AI 是打破半个世纪「技术大停滞」的唯一契机，即使灭绝风险达到 5–10% 也不应踩刹车。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源（YouTube）：\u003c/span> \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=7xbe74Bo_cQ\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=7xbe74Bo_cQ\u003c/a>\n\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>[NLW / The AI Daily Brief]\u003c/strong>（YouTube）\u003c/p>\n\u003cul>\u003cli>\n\u003cspan class=\"lbl\">观点：\u003c/span> 比较个人 Agent 怎么选：dots 底层是 GPT-6 Astra，Muse 底层是 Muse Spark；他自己的测验结果是 Grok Bot 68%、dots 62%。他还复述了 GPT-6.1 Astra 因测试中未经许可行动、误报自身行为而被搁置。\n\u003c/li>\u003cli>\n\u003cspan class=\"lbl\">来源（YouTube）：\u003c/span> \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=WloeFbIX7PU\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=WloeFbIX7PU\u003c/a>\n\u003c/li>\u003c/ul>\n\u003ch2 id=\"sec-3\">三、其他快讯\u003c/h2>\n\u003col>\u003cli>\nChatGPT 所有用户都能直接连接自定义 MCP 服务器，不用再开开发者模式（路径：plugins → add → create custom MCP server；OpenAIDevs 转发） — \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/mxstbr/status/2107166154242572454\" target=\"_blank\" rel=\"noopener\">x.com/mxstbr/status/2107166154242572454\u003c/a>\n\u003c/li>\u003cli>\nClaude 可以加入 Slack 群组私信，在话题里回复，并能使用提问者的个人连接器（Boris Cherny 转发） — \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/dfeinition/status/2107223909699371043\" target=\"_blank\" rel=\"noopener\">x.com/dfeinition/status/2107223909699371043\u003c/a>\n\u003c/li>\u003cli>\nTibo 称赞 ChatGPT 内的协作功能 Space 进步很快（引用 @matteing 的帖子） — \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/thsottiaux/status/2107200530477101461\" target=\"_blank\" rel=\"noopener\">x.com/thsottiaux/status/2107200530477101461\u003c/a>\n\u003c/li>\u003cli>\nOpenAI 文本水印的补充细节：技术名为 textGrain，在 OpenAI 的测试中达到或超过 SynthID，几乎不影响质量，并将开源 — \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/btibor91/status/2107127767951388938\" target=\"_blank\" rel=\"noopener\">x.com/btibor91/status/2107127767951388938\u003c/a>\n\u003c/li>\u003cli>\nNano Banana 2.1 疑似已在 Google Flow 上线，但输出和 Nano Banana Pro 相近，不确定是否真的换了新模型 — \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/testingcatalog/status/2107215396231348558\" target=\"_blank\" rel=\"noopener\">x.com/testingcatalog/status/2107215396231348558\u003c/a>\n\u003c/li>\u003cli>\nSimon Willison 在本地用 Qwen 3.8 27B 的推理和非推理模式，复现了早年针对 GPT-4o 的长数字加法实验 — \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/simonw/status/2107158711798218848\" target=\"_blank\" rel=\"noopener\">x.com/simonw/status/2107158711798218848\u003c/a>\n\u003c/li>\u003cli>\nGooglebook 笔记本正式开售，与 Android 手机无缝衔接、内置 Gemini（Sundar Pichai 转发） — \u003cspan class=\"pf pf-x\">𝕏\u003c/span>\u003ca href=\"https://x.com/ssamat/status/2107177652477936080\" target=\"_blank\" rel=\"noopener\">x.com/ssamat/status/2107177652477936080\u003c/a>\n\u003c/li>\u003cli>\nAnthropic Frontier Academy 计划投入 1 亿美元，明年底前培训 1 万名工程师（Bloomberg Tech，YouTube） — \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=TtEIUFK184o\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=TtEIUFK184o\u003c/a>\n\u003c/li>\u003cli>\nAnthropic 近期聘请了 Chrome 团队的 Addy Osmani（Theo，YouTube） — \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=FsDUOUV9Vs8\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=FsDUOUV9Vs8\u003c/a>\n\u003c/li>\u003cli>\n纽约市举行 AI 安全听证会，前 OpenAI 研究员 Jacob Coxon 参与，Anthropic、OpenAI、Google、Meta 代表出席（Bloomberg Tech，YouTube） — \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=TtEIUFK184o\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=TtEIUFK184o\u003c/a>\n\u003c/li>\u003cli>\na16z 第七版消费级 AI Top 100：仅约 4.5% 的消费者为 AI 付费；OpenAI 广告年化收入 10 亿美元；美国付费订阅数上 Claude 已超过 Gemini；OpenClaw 团队据称已被 OpenAI 收编（a16z，YouTube） — \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=aCvrzhwUxg0\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=aCvrzhwUxg0\u003c/a>\n\u003c/li>\u003cli>\n约 100 位科技富豪前三季度财富增加 8450 亿美元（Bloomberg Tech，YouTube） — \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=TtEIUFK184o\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=TtEIUFK184o\u003c/a>\n\u003c/li>\u003cli>\n\u003cstrong class=\"lead\">【仅据简介】\u003c/strong>特朗普「Super Intelligence」更名，细节未核实（The AI Daily Brief，YouTube） — \u003cspan class=\"pf pf-youtube\">YouTube\u003c/span>\u003ca href=\"https://www.youtube.com/watch?v=ft3psYNsdO0\" target=\"_blank\" rel=\"noopener\">youtube.com/watch?v=ft3psYNsdO0\u003c/a>\n\u003c/li>\u003c/ol>\n\u003ch2 id=\"sec-4\">四、今天值得看的视频（YouTube）\u003c/ <script>(function(){
'use strict';
const D = JSON.parse(document.getElementById('hub-data').textContent);
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '#';
const uniq = arr => [...new Set(arr)].filter(Boolean);
const PF = {x:'𝕏', youtube:'YouTube', web:'网页'};
const PF_NAME = {x:'X', youtube:'YouTube', web:'网页'};
const pfBadge = p => `<span class="pf pf-${esc(p||'web')}">${esc(PF[p]||p||'网页')}</span>`;
const stBadge = s => `<span class="badge st-${esc(s)}">${esc(s||'未知')}</span>`;
const fmtCST = iso => {
  const d = new Date(iso); if (isNaN(d)) return '—';
  return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d).replace(/\//g,'-');
};
const rel = iso => {
  const d = new Date(iso); if (isNaN(d)) return '';
  const m = Math.round((Date.now()-d)/60000);
  if (m < 1) return '刚刚'; if (m < 60) return m+' 分钟前';
  const h = m/60; if (h < 48) return Math.round(h)+' 小时前';
  return Math.round(h/24)+' 天前';
};
const todayCST = () => new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai'}).format(new Date());
const companiesOf = e => (e.company||'').split(/\s*\/\s*/).filter(Boolean);
const EVENTS = D.events;
const EVENT_BY_ID = Object.fromEntries(EVENTS.map(e => [e.id, e]));
/** 同一件事的多条记录。对不上的定义直接丢掉，不当成合并。 */
const STORIES = (Array.isArray(D.stories) ? D.stories : []).map(st => {
  const events = (st.event_ids || []).map(id => EVENT_BY_ID[id]).filter(Boolean);
  return events.length >= 2 ? {id: st.id, why: st.why || '', events, source_urls: Array.isArray(st.source_urls) ? st.source_urls : null} : null;
}).filter(Boolean);
const STORY_BY_ID = Object.fromEntries(STORIES.map(s => [s.id, s]));
const STORY_OF = {};
STORIES.forEach(s => s.events.forEach(e => { STORY_OF[e.id] = s.id; }));
/** 来源名：视频标题末尾的（频道），否则取冒号前的账号。同一名称只算 1 个独立来源。 */
function outletOf(s){
  const t = String(s.title || '').trim();
  const m = t.match(/（([^）]{1,40})）\s*$/);
  if (m) return m[1].trim();
  const m2 = t.match(/^([^：:]{1,40})[：:]/);
  if (m2) return m2[1].trim();
  return PF_NAME[s.platform] || '来源';
}
function storySources(st){
  const allow = Array.isArray(st.source_urls) ? new Set(st.source_urls) : null;
  const seen = new Set(), out = [];
  st.events.forEach(e => (e.sources || []).forEach(s => {
    if (!s || !s.url || seen.has(s.url)) return;
    if (allow && !allow.has(s.url)) return;
    seen.add(s.url); out.push(s);
  }));
  return out;
}
/** 来源行：同一名称只出现一次。多于一条时用「名称（N）」展开，每条链接都保留。 */
function sourceRowHTML(srcs){
  const groups = [];
  const by = new Map();
  srcs.forEach(s => {
    const name = outletOf(s);
    if (!by.has(name)){ const g = {name, items: []}; by.set(name, g); groups.push(g); }
    by.get(name).items.push(s);
  });
  const nOut = groups.length;
  const cnt = nOut > 1 ? `${nOut} 个独立来源` : `${srcs.length} 个来源`;
  const bits = groups.map(g => {
    if (g.items.length === 1){
      const s = g.items[0];
      return `<a class="src-name" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener" title="${esc(s.title||s.url)}">${esc(g.name)}</a>`;
    }
    const links = g.items.map(s => `<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>`).join('');
    return `<details class="src-more"><summary class="src-name">${esc(g.name)}（${g.items.length}）</summary><span class="src-pop">${links}</span></details>`;
  }).join('');
  return `<span class="src-line">${bits}<span class="cnt">${esc(cnt)}</span></span>`;
}
function packRows(rows){
  const out = [], seen = new Set();
  rows.forEach(row => {
    const sid = STORY_OF[row.e.id];
    if (!sid){ out.push({kind:'e', e: row.e, rel: row.rel, date: row.e.date}); return; }
    if (seen.has(sid)) return;
    seen.add(sid);
    const rel = rows.some(r => STORY_OF[r.e.id] === sid && r.rel === 'direct') ? 'direct' : row.rel;
    out.push({kind:'s', story: STORY_BY_ID[sid], rel, date: row.e.date});
  });
  return out;
}
const ROLES = D.roles || ['官方账号','官方人员','第三方'];
const ROLE_CLS = {'官方账号':'off','官方人员':'staff','第三方':'third'};

  $('#status-strip').innerHTML = keys.map(k => {
    const s = (D.status||{})[k] || {}; const t = s.last_success;
    const age = t ? (Date.now()-new Date(t))/3600000 : Infinity;
    const cls = !t || isNaN(age) ? 'bad' : (age > 24 ? 'warn' : '');
    const tip = t ? `${PF_NAME[k]||k} 最近成功更新：${fmtCST(t)}（北京时间）${age>24?' · 已超过 24 小时未更新':''}` : `${PF_NAME[k]||k}：暂无成功更新记录`;
    return `<span class="src ${cls}" title="${esc(tip)}"><i class="dot"></i><b>${esc(PF_NAME[k]||k)}</b>${t?esc(rel(t)):'无记录'}${age>24&&t?' ⚠':''}</span>`;
  }).join('');
}

/* ================= 日报 ================= */
const ICON_CAL = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12" rx="2"/><path d="M3 8.5h14M7 2.8v3.4M13 2.8v3.4" stroke-linecap="round"/></svg>';
const countOn = d => EVENTS.filter(e => e.date === d).length;
function archiveHTML(curDate){
  const dates = D.dailies.map(d => d.date);
  const list = D.dailies.slice(0, 30).map(d => `<li><a href="#daily/${d.date}" class="${curDate===d.date?'on':''}">${d.date}<span>${countOn(d.date)} 条动态</span></a></li>`).join('');
  return `<div class="arch"><button type="button" class="arch-btn" id="arch-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="arch-pop">${ICON_CAL}归档<span class="car">▾</span></button>
    <div class="card arch-pop" id="arch-pop" role="dialog" aria-label="日报归档" hidden>
      <input type="date" id="daily-picker" min="${dates[dates.length-1]}" max="${dates[0]}" value="${esc(curDate||'')}" aria-label="选择日期">
      <div class="arch-k">最近日报</div><ul>${list}</ul></div></div>`;
}
function setArchive(open){
  const pop = $('#arch-pop'), btn = $('#arch-btn'); if (!pop) return;
  pop.hidden = !open; btn.setAttribute('aria-expanded', open);
}
const hdrH = () => { const h = $('.top'); return getComputedStyle(h).position === 'sticky' ? h.offsetHeight : 0; };
const tocBarH = () => { const t = $('.dtoc'); return t && getComputedStyle(t).position === 'sticky' && innerWidth < 768 ? t.offsetHeight : 0; };
let spy = null, spyLock = 0;
/** 目录标签：去掉末尾括号；「…值得看的视频」统一缩短为「今日推荐视频」（保留「四、」这类序号） */
function tocLabel(text){
  const t = text.trim().replace(/（[^）]*）$/, '').replace(/\([^)]*\)$/, '').trim();
  if (!t.includes('值得看的视频')) return t;
  const m = t.match(/^([一二三四五六七八九十]{1,3}[、.．]|[①②③④⑤⑥⑦⑧⑨⑩]\s*|\d+[、.．]\s*)/);
  return (m ? m[1] : '') + '今日推荐视频';
}
function renderDaily(date){
  const v = $('#view-daily'); spy = null;
  if (!D.dailies.length){ v.innerHTML = '<div class="card empty">还没有日报。把 Markdown 放到 data/dailies/YYYY-MM-DD.md 后重新运行 python3 build.py。</div>'; return; }
  const cur = D.dailies.find(d => d.date === date) || (date ? null : D.dailies[0]);
  if (!cur){
    const n = countOn(date);
    v.innerHTML = `<div class="daily-layout no-toc"><div class="daily-main"><article class="card md"><div class="d-head"><h1>${esc(date)} 没有日报</h1>${archiveHTML(date)}</div>
      <p class="muted">${n?`当天有 ${n} 条动态，<a href="#track?from=${esc(date)}&to=${esc(date)}">去动态追踪查看</a>。`:'可以点右上角「归档」选择其它日期。'}</p></article></div></div>`;
    return bindDaily();
  }
  v.innerHTML = `<div class="daily-layout"><aside class="dtoc"><nav id="daily-toc" aria-label="小节跳转"></nav></aside>
    <div class="daily-main"><article class="card md" id="daily-md">${cur.html}<p class="muted small" style="margin-top:24px">文件：data/dailies/${esc(cur.date)}.md · 最后修改 ${esc(fmtCST(cur.mtime))}（北京时间）</p></article></div></div>`;
  // 标题行：H1 + 覆盖时段折叠箭头 + 右侧「归档」按钮；H1 后到第一个小节前的说明段落收进折叠区（内容不删）
  const md = $('#daily-md');

  if (!h1){ h1 = document.createElement('h1'); h1.textContent = cur.title; md.prepend(h1); }
  const head = document.createElement('div'); head.className = 'd-head';

  let n = h1.nextElementSibling;

  h1.before(head); head.appendChild(h1);
  if (meta.children.length){
    h1.insertAdjacentHTML('beforeend', '<button type="button" class="meta-tog" id="meta-tog" aria-expanded="false" aria-controls="d-meta" title="显示覆盖时段等说明"><span aria-hidden="true">▾</span></button>');
    head.after(meta);
  }
  head.insertAdjacentHTML('beforeend', archiveHTML(cur.date));
  // 左侧小节目录
  const heads = [...md.querySelectorAll('h2')];
  const toc = $('#daily-toc');
  toc.innerHTML = '<span class="trk" aria-hidden="true"><span class="trk-fill"></span></span>' +
    heads.map((h, i) => `<a href="#" data-sec="${h.id}" class="${i?'':'on'}"><i class="nd" aria-hidden="true"></i><span class="lb">${esc(tocLabel(h.textContent))}</span></a>`).join('');
  if (!heads.length) v.querySelector('.daily-layout').classList.add('no-toc');
  const links = [...toc.querySelectorAll('a')];
  const trk = toc.querySelector('.trk'), fill = toc.querySelector('.trk-fill');
  // 竖线：从第一个节点圆心连到最后一个节点圆心；实色部分从顶部画到当前阅读位置（进度条式）
  let ys = [], curI = 0, curFrac = 0;
  const layout = () => {
    if (!links.length || getComputedStyle(trk).display === 'none'){ ys = []; return; }
    ys = links.map(a => { const d = a.querySelector('.nd'); return a.offsetTop + d.offsetTop + d.offsetHeight / 2; });
    trk.style.top = ys[0] + 'px'; trk.style.height = (ys[ys.length-1] - ys[0]) + 'px';
    setFill(curI, curFrac);
  };
  const setFill = (i, frac) => {
    curI = i; curFrac = frac; if (!ys.length) return;
    const y = ys[i] + (i < ys.length - 1 ? frac * (ys[i+1] - ys[i]) : 0);
    fill.style.height = Math.max(0, y - ys[0]) + 'px';
  };
  const setActive = i => links.forEach((a, k) => { a.classList.toggle('on', k === i); a.classList.toggle('done', k < i); a.setAttribute('aria-current', k === i ? 'true' : 'false');
    if (k === i && toc.scrollWidth > toc.clientWidth) toc.scrollTo({left: a.offsetLeft - 12, behavior: 'smooth'}); });
  spy = () => {
    if (!v.classList.contains('on') || !heads.length || Date.now() < spyLock) return;
    const off = hdrH() + tocBarH() + 90;
    let i = 0; heads.forEach((h, k) => { if (h.getBoundingClientRect().top <= off) i = k; });
    let frac = 0;
    if (i < heads.length - 1){ const t0 = heads[i].getBoundingClientRect().top, t1 = heads[i+1].getBoundingClientRect().top;
      frac = Math.min(1, Math.max(0, (off - t0) / Math.max(1, t1 - t0))); }
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4 && heads[heads.length-1].getBoundingClientRect().top < innerHeight){ i = heads.length - 1; frac = 0; }
    if (!links[i].classList.contains('on')) setActive(i);
    setFill(i, frac);
  };
  spy.layout = layout;
  toc.addEventListener('click', ev => {
    const a = ev.target.closest('a[data-sec]'); if (!a) return; ev.preventDefault();
    const h = document.getElementById(a.dataset.sec);
    const top = h.getBoundingClientRect().top + scrollY - hdrH() - tocBarH() - 16;
    spyLock = Date.now() + 900; setActive(links.indexOf(a)); setFill(links.indexOf(a), 0);
    window.scrollTo({top, behavior: 'smooth'});
  });
  layout(); spy();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => spy && spy.layout === layout && layout());
  bindDaily();
}
function bindDaily(){
  $('#daily-picker').addEventListener('change', e => { if (e.target.value) location.hash = '#daily/'+e.target.value; });
  $('#arch-btn').addEventListener('click', () => { const open = $('#arch-pop').hidden; setArchive(open); if (open) $('#daily-picker').focus(); });
  $('#arch-pop').addEventListener('click', e => { if (e.target.closest('a')) setArchive(false); });
  const t = $('#meta-tog');
  if (t) t.addEventListener('click', () => { const open = $('#d-meta').hidden; $('#d-meta').hidden = !open; t.setAttribute('aria-expanded', open); t.title = open ? '收起说明' : '显示覆盖时段等说明'; });
}
document.addEventListener('click', e => { if (!e.target.closest('.arch')) setArchive(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#arch-pop') && !$('#arch-pop').hidden){ setArchive(false); $('#arch-btn').focus(); } });
window.addEventListener('scroll', () => { if (spy) requestAnimationFrame(() => spy && spy()); }, {passive: true});
window.addEventListener('resize', () => { if (spy){ spy.layout(); spy(); } });

/* ================= 动态追踪：数据关系 ================= */
/** 事件与某个公司 / 产品 / 政府机构的关系：'direct' 主体就是它，'related' 只是相关，null 无关 */
function relation(e, dim, key){
  if (dim === 'company'){
    if (e.entity_type === '公司' && companiesOf(e).includes(key)) return 'direct';
    if (tagHit(e, 'company', key)) return 'direct';
    if ((e.related_entities||[]).some(r => r.entity_type==='公司' && r.entity===key)) return 'related';
  } else if (dim === 'gov'){
    if (e.entity_type === '政府机构' && e.entity === key) return 'direct';
    if ((e.related_entities||[]).some(r => r.entity_type==='政府机构' && r.entity===key)) return 'related';
  } else if (dim === 'product'){
    if (e.product === key) return 'direct';
    if (tagHit(e, 'product', key)) return 'direct';
    if ((e.related_products||[]).includes(key)) return 'related';
  }
  return null;
}
const countBy = (fn) => { const m = {}; EVENTS.forEach(e => uniq(fn(e)).forEach(k => m[k] = (m[k]||0)+1)); return m; };
const sortKeys = m => Object.keys(m).sort((a,b) => m[b]-m[a] || a.localeCompare(b,'zh-CN'));
const CO_DIRECT = countBy(e => e.entity_type==='公司'?companiesOf(e):[]);
const TAGS = Array.isArray(D.filter_tags) ? D.filter_tags : [];
const tagHit = (e, kind, name) => TAGS.some(t => t && t.kind===kind && t.name===name && (t.event_ids||[]).includes(e.id));
TAGS.forEach(t => {
  if (!t || t.kind!=='company' || !t.name) return;
  const n = (t.event_ids||[]).filter(id => EVENT_BY_ID[id]).length;
  if (n && !CO_DIRECT[t.name]) CO_DIRECT[t.name] = n;
});
const COMPANIES = sortKeys(CO_DIRECT);
const PROD_N = countBy(e => [e.product].concat(e.related_products||[]).filter(k => PRODUCT_BY[k]));
TAGS.forEach(t => {
  if (!t || t.kind!=='product' || !t.name) return;
  const n = (t.event_ids||[]).filter(id => EVENT_BY_ID[id]).length;
  if (!n) return;
  if (!PRODUCT_BY[t.name]){
    const p = {product:t.name, company:t.company||'', release_date:'', status:'', aliases:[]};
    PRODUCTS.push(p); PRODUCT_BY[t.name] = p;
  }
  if (!PROD_N[t.name]) PROD_N[t.name] = n;
});
const GOV_N = countBy(e => (e.entity_type==='政府机构'?[e.entity]:[]).concat((e.related_entities||[]).filter(r=>r.entity_type==='政府机构').map(r=>r.entity)));
const GOVS = sortKeys(GOV_N);
const TYPES = uniq((D.types||[]).concat(EVENTS.map(e=>e.type)));
const STATUSES = D.statuses || ['已发布','测试中','传闻','已辟谣'];
const PLATFORMS = ['x','youtube'].concat(EVENTS.some(e => (e.sources||[]).some(s => s.platform==='web')) ? ['web'] : []);
const DATES = EVENTS.map(e=>e.date).sort();

/* ================= 动态追踪：状态与 URL ================= */
const KEYS = ['q','company','product','type','gov','status','role','pf','from','to'];
const blank = () => { const o = {desc:true}; KEYS.forEach(k => o[k] = ''); return o; };
const S = blank();
const UI = {more:false, limit:60};
const ROLE_OPTS = [['','全部'],['official','只看官方'],['官方账号','官方账号'],['官方人员','官方人员'],['第三方','第三方']];
const MORE_KEYS = ['gov','status','role','pf','from','to'];

function normalize(){
  if (S.product && PRODUCT_BY[S.product] && PRODUCT_BY[S.product].company) S.company = PRODUCT_BY[S.product].company;
  if (!ROLE_OPTS.some(([v]) => v === S.role)) S.role = '';
  if (S.pf && !PF_NAME[S.pf]) S.pf = '';
}
function hashOf(){
  const p = new URLSearchParams();
  KEYS.forEach(k => { if (S[k]) p.set(k, S[k]); });
  if (!S.desc) p.set('order','asc');
  const s = p.toString().replace(/\+/g,'%20');
  return '#track' + (s ? '?'+s : '');
}
let lastHash = null;
function commit(push){
  const h = hashOf();
  if (h !== location.hash){
    try { history[push?'pushState':'replaceState'](null, '', h); }
    catch(_) { lastHash = h; location.hash = h; return; }
  }
  lastHash = location.hash;
  $('#tab-track').setAttribute('href', h);
}
function parseTrack(tab, rest, query){
  const n = blank();
  const p = new URLSearchParams(query);
  if (tab === 'timeline'){             // 兼容 v2 链接：#timeline/product/X?roles=..&types=..&order=asc
    const dim = rest[0]; let key = rest.slice(1).join('/');
    if (dim === 'product'){ if (!PRODUCT_BY[key] && key.includes(' · ')) key = key.split(' · ').slice(1).join(' · '); n.product = key; }
    else if (dim === 'company') n.company = key;
    else if (dim === 'gov') n.gov = key;
    const roles = (p.get('roles')||'').split(',').filter(Boolean);
    if (roles.length === 2 && roles.every(isOfficial)) n.role = 'official'; else if (roles.length === 1) n.role = roles[0];
    const types = (p.get('types')||'').split(',').filter(Boolean); if (types.length === 1) n.type = types[0];
  }
  KEYS.forEach(k => { const v = p.get(k); if (v) n[k] = v; });
  if (p.get('order') === 'asc') n.desc = false;
  Object.assign(S, n); normalize(); UI.limit = 60;
}
const focusOf = () => S.product ? ['product', S.product] : S.company ? ['company', S.company] : S.gov ? ['gov', S.gov] : null;

function haystack(e){
  if (!e._h) e._h = [e.id,e.entity,e.company,e.product,e.topic,e.person,e.type,e.summary,e.status,e.conflicts,(e.tags||[]).join(' '),
    (e.related_products||[]).join(' '),(e.related_entities||[]).map(r=>r.entity).join(' '),
    Object.entries(e.key_data||{}).map(([k,v])=>k+' '+v).join(' '),(e.sources||[]).map(s=>s.title).join(' ')].join(' ').toLowerCase();
  return e._h;
}
function run(){
  const terms = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const out = [];
  for (const e of EVENTS){
    let r = 'direct';
    if (S.product){ r = relation(e,'product',S.product); if (!r) continue; }
    else if (S.company){ r = relation(e,'company',S.company); if (!r) continue; }
    if (S.gov){ const g = relation(e,'gov',S.gov); if (!g) continue; if (!S.product && !S.company) r = g; }
    if (S.type && e.type !== S.type) continue;
    if (S.status && e.status !== S.status) continue;
    if (S.role === 'official' ? !isOfficial(e.source_role) : (S.role && e.source_role !== S.role)) continue;
    if (S.pf && !(e.sources||[]).some(s => s.platform === S.pf)) continue;
    if (S.from && e.date < S.from) continue;
    if (S.to && e.date > S.to) continue;
    if (terms.length && !terms.every(t => haystack(e).includes(t))) continue;
    out.push({e, rel:r});
  }
  if (!S.desc && focusOf()) out.reverse();        // EVENTS 已按（日期, 写入顺序）倒序
  return out;
}

/* ================= 动态追踪：筛选栏 ================= */
const ICON_SEARCH = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4" stroke-linecap="round"/></svg>';
function opt(v, label, sel){ return `<option value="${esc(v)}"${v===sel?' selected':''}>${esc(label)}</option>`; }
function productOptions(){
  // 只列有动态的产品（当前选中的除外）；按动态数排序，选了公司时只列该公司的产品
  const n = p => PROD_N[p.product]||0;
  const list = PRODUCTS.filter(p => (!S.company || p.company === S.company) && (n(p) || p.product === S.product))
    .sort((a,b) => n(b)-n(a) || a.product.localeCompare(b.product,'zh-CN'));
  let html = opt('', '全部产品', S.product);
  if (S.product && !list.some(p => p.product === S.product)) html += opt(S.product, S.product, S.product);
  if (S.company) return html + list.map(p => opt(p.product, p.product, S.product)).join('');
  const groups = {}; list.forEach(p => (groups[p.company||'其他'] = groups[p.company||'其他'] || []).push(p));
  const order = Object.keys(groups).sort((a,b) => (COMPANIES.indexOf(a)+1||999) - (COMPANIES.indexOf(b)+1||999));
  return html + order.map(c => `<optgroup label="${esc(c)}">${groups[c].map(p => opt(p.product, p.product, S.product)).join('')}</optgroup>`).join('');
}
/** 某个筛选项在「其它筛选都不变、只放开它自己」时各取值的事件数（类型 / 状态 / 平台 / 信源的选项都随其它筛选变化） */
function facetCounts(k){
  const saved = S[k]; S[k] = '';
  const rows = run(); S[k] = saved;
  const m = {}; const add = v => m[v] = (m[v]||0)+1;
  rows.forEach(({e}) => {
    if (k === 'type') add(e.type);
    else if (k === 'status') add(e.status);
    else if (k === 'pf') uniq((e.sources||[]).map(x => x.platform)).forEach(add);
    else if (k === 'role'){ add(e.source_role); if (isOfficial(e.source_role)) add('official'); }
  });
  m[''] = rows.length;
  return m;
}
const cntLabel = (l, n) => `${l} (${n||0})`;
/** 选项：数量为 0 的隐藏；当前选中的即使变成 0 也保留并显示 (0)，不悄悄重置 */
function typeOptions(){
  const m = facetCounts('type');
  const types = TYPES.filter(t => m[t] || t === S.type);
  if (S.type && !types.includes(S.type)) types.push(S.type);
  return opt('', '全部类型', S.type) + types.map(t => opt(t, cntLabel(t, m[t]), S.type)).join('');
}
function pills(k, items, counted){
  const m = counted ? facetCounts(k) : null;
  const shown = m ? items.filter(([v]) => v === '' || m[v] || S[k] === v) : items;
  return `<div class="pills" role="group" data-group="${k}">${shown.map(([v,l]) => `<button type="button" data-k="${k}" data-v="${esc(v)}" class="${S[k]===v?'on':''}" aria-pressed="${S[k]===v}">${esc(m ? cntLabel(l, m[v]) : l)}</button>`).join('')}</div>`;
}
const STATUS_ITEMS = () => [['','全部']].concat(STATUSES.map(s=>[s,s]));
const PF_ITEMS = () => [['','全部']].concat(PLATFORMS.map(p=>[p,PF_NAME[p]]));
/** 搜索框输入时只刷新结果，这里顺便刷新各筛选项的数量（不重建输入框，避免打断中文输入法） */
function refreshFacets(){
  const sel = document.querySelector('select[data-k="type"]'); if (sel) sel.innerHTML = typeOptions();
  [['status', STATUS_ITEMS()], ['pf', PF_ITEMS()], ['role', ROLE_OPTS]].forEach(([k, items]) => {
    const g = document.querySelector(`.pills[data-group="${k}"]`); if (g) g.outerHTML = pills(k, items, true);
  });
}
function controlsHTML(){
  const cos = COMPANIES.slice(); if (S.company && !cos.includes(S.company)) cos.unshift(S.company);
  const nMore = MORE_KEYS.filter(k => S[k]).length - (S.from && S.to ? 1 : 0);
  return `<div class="fbar" role="search">
    <div class="fsearch">${ICON_SEARCH}<input id="f-q" type="search" placeholder="搜索公司、产品、人物、关键词…" aria-label="搜索" value="${esc(S.q)}" autocomplete="off"></div>
    <select data-k="company" aria-label="公司" class="${S.company?'set':''}">${opt('','全部公司',S.company)}${cos.map(c => opt(c, c, S.company)).join('')}</select>
    <select data-k="product" aria-label="产品" class="${S.product?'set':''}">${productOptions()}</select>
    <select data-k="type" aria-label="类型" class="${S.type?'set':''}">${typeOptions()}</select>
    <button type="button" class="morebtn" id="f-more" aria-expanded="${UI.more}" aria-controls="more">更多筛选${nMore?`<span class="cnt">${nMore}</span>`:''}<span class="car">▾</span></button>
  </div>
  <div class="card morepanel" id="more"${UI.more?'':' hidden'}>
    <div class="mp-f"><span class="k">政府机构</span><div><select data-k="gov" aria-label="政府机构">${opt('','全部政府机构',S.gov)}${(S.gov && !GOVS.includes(S.gov) ? [S.gov] : []).concat(GOVS).map(g => opt(g, g, S.gov)).join('')}</select></div></div>
    <div class="mp-f"><span class="k">状态</span>${pills('status', STATUS_ITEMS(), true)}</div>
